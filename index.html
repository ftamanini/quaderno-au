<style>
/* Layout: colonna mobile (max 560px) — header sticky, contenuto scorrevole, tab bar fissa in basso. Lavagna verde campo uguale in entrambi i temi. */
:root{
  --bg:#F7F7F7; --surface:#FFFFFF; --surface-2:#EDEDED; --line:#DCDCDC;
  --ink:#161616; --ink-2:#4A4A4A; --ink-3:#787878;
  --accent:#161616; --accent-ink:#F7F7F7; --accent-soft:#ECECEC;
  --hi:#FDDD10; --hi-ink:#161616; --mark:#FDDD10;
  --att:#1E4FD6; --def:#C73128; --cone:#EE7B12; --pass:#FDDD10; --shield:#5B6670;
  --pitch:#2D6747; --pitch-2:#295F41; --pitch-line:rgba(255,255,255,.8);
  --danger:#B42318; --danger-soft:#F8E1DE;
  --shadow:0 1px 2px rgba(22,22,22,.06),0 6px 20px rgba(22,22,22,.07);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --r-sm:9px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161616; --surface:#1F1F1F; --surface-2:#292929; --line:#363636;
  --ink:#F7F7F7; --ink-2:#BDBDBD; --ink-3:#8C8C8C;
  --accent:#F7F7F7; --accent-ink:#161616; --accent-soft:#2E2E2E; --mark:#161616;
  --att:#5582FF; --def:#EF5A4F; --shield:#8A949C;
  --pitch:#1F4C34; --pitch-2:#1C4530;
  --danger:#F0756B; --danger-soft:#3A1C19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161616; --surface:#1F1F1F; --surface-2:#292929; --line:#363636;
  --ink:#F7F7F7; --ink-2:#BDBDBD; --ink-3:#8C8C8C;
  --accent:#F7F7F7; --accent-ink:#161616; --accent-soft:#2E2E2E; --mark:#161616;
  --att:#5582FF; --def:#EF5A4F; --shield:#8A949C;
  --pitch:#1F4C34; --pitch-2:#1C4530;
  --danger:#F0756B; --danger-soft:#3A1C19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.screen.enter{animation:slideIn .26s var(--ease)}
.screen.enter-back{animation:slideBack .26s var(--ease)}
@keyframes slideIn{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideBack{from{transform:translateX(-18px);opacity:.4}to{transform:none;opacity:1}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px 10px;display:flex;align-items:center;gap:10px;min-height:58px}
.topbar h1{font:700 26px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin:0;flex:1;min-width:0}
.topbar h1 small{display:block;font:600 11px/1.2 var(--f-display);letter-spacing:.14em;color:var(--ink-3);margin-bottom:3px}
.topbar .title-sm{font:600 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--ink);position:relative;transition:background .15s,transform .12s}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.92)}
.iconbtn .badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 11px/17px var(--f-mono);text-align:center;animation:pop .25s var(--ease)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.sync{flex:none;display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-body);color:var(--ink-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.cloud i{background:var(--accent)}

/* ---------- search + chips ---------- */
.searchrow{padding:2px 16px 10px;display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;font-size:16px}
.search svg{color:var(--ink-3)}
.filterbtn{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:6px;font-weight:600;transition:all .15s}
.filterbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filterbtn .n{font:600 12px/1 var(--f-mono)}
.chiprail{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chiprail::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s,border-color .15s,transform .12s;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.static{height:26px;padding:0 10px;font-size:13px;cursor:default}
.chip.x svg{width:14px;height:14px}
.chip.active-f{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.resultline{padding:2px 16px 8px;display:flex;justify-content:space-between;align-items:center;color:var(--ink-3);font-size:13px}
.sortbtn{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink-2);font-size:13px}
.sortbtn svg{width:16px;height:16px}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.card{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%;transition:transform .14s var(--ease),box-shadow .2s,border-color .2s;animation:rise .3s var(--ease) both}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow)}
.card:active{transform:scale(.985)}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.thumb{flex:none;width:96px;aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:var(--pitch)}
.thumb svg{display:block;width:100%;height:100%}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:2px 0}
.card .name{display:block;font:600 19px/1.1 var(--f-display);letter-spacing:.01em;margin:0}
.card .focus{font-size:13px;font-weight:600;color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:auto;color:var(--ink-2);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:15px;height:15px}
.tag-ex{font:600 10px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:3px 5px;align-self:flex-start}

.empty{margin:28px 16px;padding:28px 20px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--ink-2)}
.empty h2{font:700 22px/1.1 var(--f-display);text-transform:uppercase;color:var(--ink);margin:12px 0 6px}
.empty p{margin:0 auto 16px;max-width:34ch;font-size:15px}
.empty svg.art{width:120px;height:90px;border-radius:10px}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border:1px solid var(--line)}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- buttons ---------- */
.btn{height:46px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;transition:transform .12s,background .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{position:fixed;z-index:30;right:max(16px,calc(50% - 264px));bottom:calc(86px + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px 0 16px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font:600 17px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s var(--ease)}
.fab:active{transform:scale(.94)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font:600 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;position:relative;transition:color .2s}
.tab[aria-selected="true"]{color:var(--accent)}
.tab::after{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent);transform:scaleX(0);transition:transform .25s var(--ease)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
</style>
<style>
/* ---------- detail ---------- */
.detail{padding:0 16px;display:flex;flex-direction:column;gap:16px}
.boardframe{border-radius:var(--r);overflow:hidden;background:var(--pitch);box-shadow:var(--shadow);position:relative}
.boardframe svg{display:block;width:100%;height:auto}
.boardframe .edit-hint{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;backdrop-filter:blur(4px)}
.boardframe .edit-hint svg{width:16px;height:16px}
.d-title{font:700 32px/1 var(--f-display);text-transform:uppercase;letter-spacing:.005em;margin:2px 0 6px;text-wrap:balance}
.d-focus{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:10px 8px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat b{font:500 20px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat b.att{color:var(--att)} .stat b.def{color:var(--def)}
.stat span{font:600 11px/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.taglist{display:flex;flex-wrap:wrap;gap:6px}
.section h3{font:600 13px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.section p{margin:0;white-space:pre-wrap;color:var(--ink)}
.keypoints{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.keypoints li{display:flex;gap:10px;align-items:flex-start}
.keypoints li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.equip{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--ink-2);font-size:14px}
.equip span{display:inline-flex;align-items:center;gap:6px}
.dactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}

/* ---------- form ---------- */
.form{padding:0 16px;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font:600 13px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline}
.field>label em,.field>.lbl em{font:400 12px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink-3);font-style:normal}
.input,.textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.big{font:600 22px/1.2 var(--f-display);letter-spacing:.01em}
.textarea{min-height:96px;resize:vertical;line-height:1.45}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.group{display:flex;flex-direction:column;gap:6px}
.group .gname{font-size:13px;color:var(--ink-3);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 4px}
.stepper button{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;transition:background .12s,transform .1s}
.stepper button:hover{background:var(--surface-2)}
.stepper button:active{transform:scale(.88)}
.stepper output{font:500 18px/1 var(--f-mono);min-width:3ch;text-align:center}
.stepper output.dim{color:var(--ink-3)}
.boardpick{position:relative;border-radius:var(--r);overflow:hidden;background:var(--pitch);border:0;width:100%;display:block}
.boardpick svg{display:block;width:100%;height:auto}
.boardpick .cta{position:absolute;inset:auto 10px 10px auto;display:flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px;box-shadow:var(--shadow)}
.boardsum{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.boardsum b{font-family:var(--f-mono);font-weight:500}
.auto-note{font-size:13px;color:var(--ink-3)}
.linkbtn{color:var(--accent);font-weight:600;font-size:13px}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:12px 16px 4px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:8px;z-index:5}
.err{color:var(--danger);font-size:13px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(6,12,9,.42);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .3s var(--ease) both;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.closing{animation:down .2s ease forwards}
.scrim.closing{animation:fade .2s ease reverse forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px}
.sheet header{display:flex;align-items:center;padding:8px 16px 8px;gap:8px}
.sheet header h2{flex:1;margin:0;font:700 22px/1 var(--f-display);text-transform:uppercase}
.sheet .sbody{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:20px}
.sheet footer{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.sheet footer .btn{flex:1}
.optlist{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:500;text-align:left}
.opt svg{color:var(--accent)}

/* ---------- board editor ---------- */
.editor{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s var(--ease) both}
.editor .ebar{display:flex;align-items:center;gap:4px;padding:8px 10px;max-width:960px;width:100%;margin:0 auto}
.editor .ebar .title-sm{flex:1;padding-left:6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{height:32px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.estage{flex:0 1 auto;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:4px 10px}
.estage .bwrap{width:min(100%,960px,calc((100dvh - 290px) * 4 / 3));aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--pitch);box-shadow:var(--shadow)}
.estage svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.ecount{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--ink-2);padding:6px 10px 2px;flex-wrap:wrap}
.ecount b{font-family:var(--f-mono);font-weight:500}
.ehint{text-align:center;font-size:13px;color:var(--ink-3);min-height:20px;padding:0 16px}
.tools{max-width:960px;width:100%;margin:0 auto;padding:8px 10px 10px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 1px;border-radius:12px;font:600 11.5px/1 var(--f-display);letter-spacing:0;min-width:0;color:var(--ink-2);transition:background .15s,color .15s,transform .1s}
.tool:active{transform:scale(.92)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tool svg{width:26px;height:26px}
.selbar{display:flex;justify-content:center;gap:8px;padding:0 10px;min-height:40px;align-items:center;margin-bottom:auto}
.selbar .btn{height:38px;font-size:14px;padding:0 14px}
.bitem{cursor:grab}

.glogo svg{display:block;width:100%;height:100%}
.gname{margin:0;text-align:center;font:700 30px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em}

<script>
"use strict";
/* ================= FONT NON BLOCCANTI ================= */
(function(){const l=document.getElementById("gfonts");if(!l)return;const on=()=>{l.media="all"};if(l.sheet)on();else l.addEventListener("load",on)})();

/* ================= TASSONOMIA (personalizzabile) ================= */
const DEFAULT_TAX={groups:[
  {id:"focus",l:"Focus",single:true,tags:[["placcaggio","Placcaggio"],["passaggio","Passaggio e ricezione"],["sostegno","Sostegno"],["breakdown","Breakdown / Ruck"],["maul","Maul"],["uno-uno","Uno contro uno"],["superiorita","Superiorità numerica"],["linea-difesa","Linea difensiva"],["piede","Gioco al piede"],["ripartenze","Ripartenze"]]},
  {id:"org",l:"Organizzazione",tags:[["individuale","Individuale"],["coppie","A coppie"],["piccoli-gruppi","Piccoli gruppi"],["reparto","Reparto"],["collettivo-parziale","Collettivo parziale"],["collettivo","Collettivo"]]},
  {id:"gruppo",l:"Gruppo",tags:[["avanti","Avanti"],["trequarti","Trequarti"],["tutti","Tutta la squadra"]]},
  {id:"sit",l:"Situazione",scope:"plays",tags:[["touche","Touche"],["mischia","Mischia"],["punto-incontro","Punto d'incontro"],["ripartenza","Ripartenza"],["prima-fase","Prima fase"],["altro","Altro"]]},
  {id:"zona",l:"Zona del campo",scope:"plays",tags:[["tutto","Tutto il campo"],["nostri-22","Nostri 22"],["nostra-meta","Nostra metà campo"],["loro-meta","Loro metà campo"],["loro-22","Loro 22"],["loro-5m","5 metri"]]}
].map(g=>({...g,tags:g.tags.map(([id,l])=>({id,l}))}))};
const DEFAULT_TAG_IDS=new Set(DEFAULT_TAX.groups.flatMap(g=>g.tags.map(t=>t.id)));
let TAX,FOCUS,TAG_GROUPS,TAG,FOC,PLAY_GROUPS,PTAG;
function normTax(t){
  const src=(t&&Array.isArray(t.groups))?t:DEFAULT_TAX;
  const groups=src.groups.filter(g=>g&&typeof g.id==="string"&&Array.isArray(g.tags)).map(g=>({id:g.id,l:String(g.l||g.id).slice(0,40),single:false,scope:g.scope==="plays"?"plays":undefined,
    tags:g.tags.filter(x=>x&&typeof x.id==="string").map(x=>({id:x.id.slice(0,120),l:String(x.l||"").slice(0,40)}))}));
  DEFAULT_TAX.groups.forEach((dg,i)=>{if(!groups.some(g=>g.id===dg.id)) groups.splice(Math.min(i,groups.length),0,JSON.parse(JSON.stringify(dg)))});
  /* aggiornamento una tantum: elenchi salvati prima di "Tutto il campo" e "Punto d'incontro".
     Il segno "p2" resta nel documento, così se poi le elimini non ricompaiono. */
  const mig=(Array.isArray(src.mig)?src.mig:[]).filter(m=>typeof m==="string").slice(0,20);
  if(!mig.includes("p2")){
    const ens=(gid,id,l,after)=>{const g=groups.find(x=>x.id===gid); if(!g||g.tags.some(x=>x.id===id)) return;
      const i=after?g.tags.findIndex(x=>x.id===after)+1:0; g.tags.splice(Math.max(0,i),0,{id,l})};
    ens("zona","tutto","Tutto il campo",null); ens("sit","punto-incontro","Punto d'incontro","mischia");
    mig.push("p2");
  }
  return {groups,mig};
}
function applyTaxOps(base,ops){
  const t=normTax(base);
  for(const o of ops||[]){
    const g=t.groups.find(x=>x.id===o.g); if(!g) continue;
    if(o.t==="add"){ if(!g.tags.some(x=>x.id===o.id)) g.tags.push({id:o.id,l:o.l}) }
    else if(o.t==="ren"){ const x=g.tags.find(x=>x.id===o.id); if(x) x.l=o.l }
    else if(o.t==="del"){ g.tags=g.tags.filter(x=>x.id!==o.id) }
  }
  return t;
}
function setTax(t){
  TAX=normTax(t);
  FOCUS=TAX.groups.find(g=>g.id==="focus").tags;
  PLAY_GROUPS=TAX.groups.filter(g=>g.scope==="plays").map(g=>({...g,tags:g.tags.map(x=>({...x,g:g.id}))}));
  PTAG=Object.fromEntries(PLAY_GROUPS.flatMap(g=>g.tags).map(x=>[x.id,x]));
  TAG_GROUPS=TAX.groups.filter(g=>g.id!=="focus"&&g.scope!=="plays").map(g=>({...g,tags:g.tags.map(x=>({...x,g:g.id}))}));
  TAG=Object.fromEntries(TAG_GROUPS.flatMap(g=>g.tags).map(x=>[x.id,x]));
  FOC=Object.fromEntries(FOCUS.map(f=>[f.id,f]));
}
setTax(DEFAULT_TAX);

/* ================= UTIL ================= */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRAND=`<span class="brand" role="img" aria-label="Quaderno Tecnico Rugby"><svg viewBox="-4 -4 305 302" aria-hidden="true"><use href="#logo"/></svg></span>`;
const BRAND_SM=BRAND.replace('class="brand"','class="brand sm"');
const ico = (n,cls="i")=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone = o=>JSON.parse(JSON.stringify(o));
const fold = s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch{}}
const locks={};
function lock(key,ms=700){const n=Date.now();if(n<(locks[key]||0))return false;locks[key]=n+ms;return true}
function toast(msg,icon="check",action,ms){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"+(action?" act":""); t.setAttribute("role","status");
  t.innerHTML=ico(icon)+`<span>${esc(msg)}</span>`+(action?`<button type="button">${esc(action.label)}</button>`:"");
  const dur=ms||(action?6500:2500); t.style.animationDuration=dur+"ms";
  if(action) t.querySelector("button").onclick=()=>{t.remove();action.run()};
  document.body.appendChild(t); setTimeout(()=>t.remove(),dur+100);
}
function ago(ts){
  if(!ts) return "mai";
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1) return "adesso"; if(m<60) return m+" min fa";
  const h=Math.round(m/60); if(h<24) return h===1?"1 ora fa":h+" ore fa";
  const d=Math.round(h/24); return d===1?"ieri":d+" giorni fa";
}
const hhmm=ts=>ts?new Date(ts).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"—";

/* ================= CONTROLLO DATI (server, backup importati) ================= */
const ID_RE=/^[A-Za-z0-9_\-.~:@+]{1,120}$/;
const num=(v,d,min,max)=>{v=+v;return Number.isFinite(v)?Math.min(max,Math.max(min,v)):d};
const str=(v,max)=>typeof v==="string"?v.slice(0,max):"";
function cleanBoard(b){
  b=b&&typeof b==="object"?b:{}; b=upgradeBoard(b); // lavagne vecchie (Laterale/Campo) → campo unico
  const areas=(Array.isArray(b.areas)?b.areas:[]).slice(0,8).filter(a=>a&&ID_RE.test(String(a.id))).map(a=>({id:String(a.id),
    x:+num(a.x,200,0,400).toFixed(1),y:+num(a.y,150,0,300).toFixed(1),w:+num(a.w,10,1,70).toFixed(1),h:+num(a.h,10,1,50).toFixed(1)}));
  const aids=new Set(areas.map(a=>a.id));
  const items=(Array.isArray(b.items)?b.items:[]).slice(0,250).filter(i=>i&&ID_RE.test(String(i.id))&&ITEM_TYPES[i.t]).map(i=>{
    const o={id:String(i.id),t:i.t,x:num(i.x,200,0,400),y:num(i.y,150,0,300)}; if(i.n!=null&&i.t!=="sh") o.n=Math.round(num(i.n,1,0,99));
    if(i.t==="cone"&&aids.has(i.ar)&&[0,1,2,3].includes(i.ck)){o.ar=i.ar;o.ck=i.ck} return o});
  const lines=(Array.isArray(b.lines)?b.lines:[]).slice(0,250).filter(l=>l&&ID_RE.test(String(l.id))&&(l.t==="run"||l.t==="pass")).map(l=>({id:String(l.id),t:l.t,
    x1:num(l.x1,0,0,400),y1:num(l.y1,0,0,300),x2:num(l.x2,0,0,400),y2:num(l.y2,0,0,300)}));
  const v=b.view&&typeof b.view==="object"?b.view:DEF_VIEW, cv=clampView({x:num(v.x,200,0,400),y:num(v.y,150,0,300),z:num(v.z,1,1,ZMAX)});
  return {bg:"pitch",items,lines,areas,view:{x:+cv.x.toFixed(1),y:+cv.y.toFixed(1),z:+cv.z.toFixed(3)}};
}
function cleanEx(raw,id){
  if(!raw||typeof raw!=="object") return null;
  id=String(id??raw.id??""); if(!ID_RE.test(id)) return null;
  const pl=raw.players&&typeof raw.players==="object"?raw.players:null;
  const board=cleanBoard(raw.board);
  const fl=Array.isArray(raw.focuses)?raw.focuses:(raw.focus!=null?[raw.focus]:[]);
  const focuses=[...new Set(fl.filter(f=>typeof f==="string"&&ID_RE.test(f)))].slice(0,15);
  return {id,name:str(raw.name,80),focuses,focus:focuses[0]||null,
    tags:(Array.isArray(raw.tags)?raw.tags:[]).filter(t=>typeof t==="string"&&ID_RE.test(t)).slice(0,40),
    players:pl?{att:Math.round(num(pl.att,0,0,60)),def:Math.round(num(pl.def,0,0,60)),auto:pl.auto!==false}:autoPlayers(board),
    duration:Math.round(num(raw.duration,10,0,300)),area:str(raw.area,40),description:str(raw.description,8000),keyPoints:str(raw.keyPoints,4000),
    variations:str(raw.variations,4000),board,phases:(Array.isArray(raw.phases)?raw.phases:[]).slice(0,30).map(cleanPhase).filter(Boolean),
    example:!!raw.example,createdAt:num(raw.createdAt,0,0,9e15),updatedAt:num(raw.updatedAt,0,0,9e15)};
}
const bodyOf=ex=>{const {id,...b}=ex;return b};
const TEAMS=[{id:"u14",l:"U14"},{id:"u16",l:"U16"},{id:"u18",l:"U18"}];
const TEAM=Object.fromEntries(TEAMS.map(t=>[t.id,t]));
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const logId=(date,team,exId)=>`${date}_${team}_${exId}`;
function cleanPhase(p,i){
  if(!p||typeof p!=="object") return null;
  const pos={}; if(p.pos&&typeof p.pos==="object") for(const [k,v] of Object.entries(p.pos)){ if(ID_RE.test(k)&&v&&typeof v==="object") pos[k]={x:num(v.x,200,0,400),y:num(v.y,150,0,300)} }
  const hold={}; if(p.hold&&typeof p.hold==="object") for(const [k,v] of Object.entries(p.hold).slice(0,20)){ if(ID_RE.test(k)) hold[k]=typeof v==="string"&&ID_RE.test(v)?v:null }
  return {id:ID_RE.test(String(p.id))?String(p.id):"ph"+i,title:str(p.title,60),text:str(p.text,1000),pos,hold,
    ball:typeof p.ball==="string"&&ID_RE.test(p.ball)?p.ball:null,lines:cleanBoard({lines:p.lines}).lines,dur:Math.round(num(p.dur,1500,200,10000))};
}
const cleanStart=s=>s&&typeof s==="object"&&["scrum","lineout","ruck"].includes(s.type)?{type:s.type,side:["l","c","r"].includes(s.side)&&!(s.type==="lineout"&&s.side==="c")?s.side:"l",def:s.def!==false}:null;
/* Schemi salvati prima dell'inversione (attacco verso il basso): capovolti una volta, attacco verso l'alto */
function upgradePlay(raw){
  const b=raw.board&&typeof raw.board==="object"?raw.board:{};
  if(+raw.v>=2||!(b.bg==null||b.bg==="half"||b.bg==="side")) return raw;
  const fy=v=>v==null||!Number.isFinite(+v)?v:300-(+v);
  const fl=l=>l&&typeof l==="object"?{...l,y1:fy(l.y1),y2:fy(l.y2)}:l;
  const arr=a=>Array.isArray(a)?a:[];
  return {...raw,v:2,
    board:{...b,bg:b.bg==="half"?"halfup":"sideup",items:arr(b.items).map(i=>i&&typeof i==="object"?{...i,y:fy(i.y)}:i),lines:arr(b.lines).map(fl)},
    phases:arr(raw.phases).map(ph=>!ph||typeof ph!=="object"?ph:{...ph,lines:arr(ph.lines).map(fl),
      pos:Object.fromEntries(Object.entries(ph.pos&&typeof ph.pos==="object"?ph.pos:{}).map(([k,v])=>[k,v&&typeof v==="object"?{...v,y:fy(v.y)}:v]))})};
}
/* Schemi su Laterale/Campo → campo unico: anche le fasi seguono le pedine */
function upgradePlayPitch(raw){
  const L=legacyOf(raw.board&&raw.board.bg); if(!L) return raw;
  const arr=a=>Array.isArray(a)?a:[];
  const fl=l=>{if(!l||typeof l!=="object")return l;const [x1,y1]=legacyPt(L,l.x1,l.y1),[x2,y2]=legacyPt(L,l.x2,l.y2);return {...l,x1,y1,x2,y2}};
  return {...raw,phases:arr(raw.phases).map(ph=>!ph||typeof ph!=="object"?ph:{...ph,lines:arr(ph.lines).map(fl),
    pos:Object.fromEntries(Object.entries(ph.pos&&typeof ph.pos==="object"?ph.pos:{}).map(([k,v])=>{if(!v||typeof v!=="object")return [k,v];const [x,y]=legacyPt(L,v.x,v.y);return [k,{...v,x,y}]}))})};
}
function cleanPlay(raw,id){
  if(!raw||typeof raw!=="object") return null;
  id=String(id??raw.id??""); if(!ID_RE.test(id)) return null;
  raw=upgradePlayPitch(upgradePlay(raw));
  const ids=(a,max)=>[...new Set((Array.isArray(a)?a:[]).filter(t=>typeof t==="string"&&ID_RE.test(t)))].slice(0,max);
  return {id,name:str(raw.name,80),situation:typeof raw.situation==="string"&&ID_RE.test(raw.situation)?raw.situation:null,zones:ids(raw.zones,10),
    description:str(raw.description,8000),keyPoints:str(raw.keyPoints,4000),notes:str(raw.notes,4000),board:cleanBoard(raw.board),
    start:cleanStart(raw.start),phases:(Array.isArray(raw.phases)?raw.phases:[]).slice(0,30).map(cleanPhase).filter(Boolean),v:3,createdAt:num(raw.createdAt,0,0,9e15),updatedAt:num(raw.updatedAt,0,0,9e15)};
}
function cleanLog(raw,id){
  if(!raw||typeof raw!=="object") return null; id=String(id??raw.id??""); if(!ID_RE.test(id)) return null;
  if(!DATE_RE.test(String(raw.date))||!TEAM[raw.team]||!ID_RE.test(String(raw.exId))) return null;
  return {id,date:raw.date,team:raw.team,exId:String(raw.exId),at:num(raw.at,0,0,9e15)};
}

/* ================= ARCHIVIO: copia sul telefono + coda di invio ================= */
const Store=(()=>{
  const K={cache:"qtr.cache.v2",out:"qtr.outbox.v2",oldEx:"qtr.exercises.v1",oldTax:"qtr.taxonomy.v1"};
  const TIMEOUT=15000;
  const inflight=new Map();
  let db=null, conn="init", ready=false, flushing=false, backoff=0, nextTryAt=0, timer=null, lastErr=null, fatal=null, lastSyncAt=0, outboxFull=false;
  const server={items:null,tax:undefined,backup:undefined,log:null,plays:null};
  const cache=lsGet(K.cache,null);
  let out=lsGet(K.out,null); if(!out||typeof out!=="object"||!out.docs) out={seq:0,docs:{},tax:[]};
  let view=[], viewMap={}, logView=[], playView=[], playMap={};
  const subs=new Set(); let emitQ=null;
  const emit=kind=>{ emitQ=emitQ==="data"||kind==="data"?"data":"status"; queueMicrotask(()=>{ if(!emitQ) return; const k=emitQ; emitQ=null; subs.forEach(f=>f(k)) }) };
  const baseItems=()=>server.items||(cache&&cache.items)||{};
  const baseTax=()=>server.tax!==undefined?server.tax:(cache&&cache.tax!==undefined?cache.tax:undefined);
  function recompute(){
    const m={...baseItems()};
    for(const [p,e] of Object.entries(out.docs)){ if(!p.startsWith("exercises/")) continue; const id=p.slice(10);
      if(e.op==="del") delete m[id]; else { const c=cleanEx(e.body,id); if(c) m[id]=c } }
    viewMap={}; view=Object.entries(m).map(([id,x])=>{const c=x.id===id?x:cleanEx(x,id);if(c)viewMap[id]=c;return c}).filter(Boolean);
    const pm={...(server.plays||(cache&&cache.plays)||{})};
    for(const [p,e] of Object.entries(out.docs)){ if(!p.startsWith("plays/")) continue; const id=p.slice(6); if(e.op==="del") delete pm[id]; else { const c=cleanPlay(e.body,id); if(c) pm[id]=c } }
    playMap={}; playView=Object.entries(pm).map(([id,x])=>{const c=x&&x.id===id?x:cleanPlay(x,id);if(c)playMap[id]=c;return c}).filter(Boolean);
    const lm={...(server.log||(cache&&cache.log)||{})};
    for(const [p,e] of Object.entries(out.docs)){ if(!p.startsWith("log/")) continue; const id=p.slice(4); if(e.op==="del") delete lm[id]; else { const c=cleanLog(e.body,id); if(c) lm[id]=c } }
    logView=Object.entries(lm).map(([id,x])=>x&&x.id===id?x:cleanLog(x,id)).filter(Boolean);
    const bt=baseTax(); setTax(applyTaxOps(bt===undefined||bt===null?DEFAULT_TAX:bt,out.tax));
  }
  function saveOut(){ if(!lsSet(K.out,out)){ outboxFull=true; toast("Memoria del telefono piena: esporta un backup","close") } else outboxFull=false }
  let cacheT=null;
  function saveCache(){ clearTimeout(cacheT); cacheT=setTimeout(()=>{ lsSet(K.cache,{items:server.items||(cache&&cache.items)||{},tax:server.tax!==undefined?server.tax:(cache&&cache.tax),backup:server.backup!==undefined?server.backup:(cache&&cache.backup),log:server.log||(cache&&cache.log)||{},plays:server.plays||(cache&&cache.plays)||{},at:Date.now()}) },600) }
  const pending=()=>Object.keys(out.docs).length+out.tax.length;
  function enqueueDoc(path,op,body){ out.seq++; out.docs[path]={seq:out.seq,op,body:body?clone(body):undefined,ts:Date.now()}; saveOut(); recompute(); emit("data"); kick(0) }
  function kick(ms){ clearTimeout(timer); timer=setTimeout(()=>{timer=null;flush()},ms) }
  const kickSoon=()=>{ if(Date.now()>=nextTryAt) kick(0) };
  const withTimeout=p=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),TIMEOUT))]);
  async function flush(){
    if(flushing||!db||server.items===null||!pending()) return;
    flushing=true; emit("status");
    try{
      for(;;){
        const next=Object.entries(out.docs).sort((a,b)=>a[1].seq-b[1].seq)[0]; if(!next) break;
        const [path,e]=next, [col,id]=path.split("/");
        const srv=col==="exercises"?server.items[id]:(col==="plays"&&server.plays?server.plays[id]:null);
        if(e.op==="set"&&srv&&e.body&&+srv.updatedAt>+e.body.updatedAt){ delete out.docs[path]; saveOut(); continue } // il server ha già una versione più recente
        const ref=db.collection(col).doc(id), key=path+"#"+e.seq;
        try{ let p=inflight.get(key); if(!p){ p=e.op==="del"?ref.delete():ref.set(e.body); inflight.set(key,p); p.then(()=>inflight.delete(key),()=>inflight.delete(key)) } await withTimeout(p) }
        catch(err){ if(err&&(err.code==="invalid_argument"||err.code==="invalid-argument")){ (out.rejected=out.rejected||{})[path]=e; delete out.docs[path]; saveOut(); toast("Il server ha rifiutato una modifica (dati non validi)","close"); continue } throw err }
        if(out.docs[path]&&out.docs[path].seq===e.seq){ delete out.docs[path]; saveOut() }
        if(col==="exercises"){ if(e.op==="del") delete server.items[id]; else server.items[id]=cleanEx(e.body,id) }
        if(col==="plays"&&server.plays){ if(e.op==="del") delete server.plays[id]; else { const c=cleanPlay(e.body,id); if(c) server.plays[id]=c } }
        if(col==="log"&&server.log){ if(e.op==="del") delete server.log[id]; else { const c=cleanLog(e.body,id); if(c) server.log[id]=c } }
        recompute(); emit("status");
      }
      if(out.tax.length&&server.tax!==undefined){
        const ops=out.tax.slice(), top=ops[ops.length-1].seq, next=applyTaxOps(server.tax||DEFAULT_TAX,ops), key="tax#"+top;
        let p=inflight.get(key); if(!p){ p=db.doc("config/taxonomy").set(next); inflight.set(key,p); p.then(()=>inflight.delete(key),()=>inflight.delete(key)) }
        await withTimeout(p);
        out.tax=out.tax.filter(o=>o.seq>top); saveOut(); server.tax=next; recompute();
      }
      backoff=0; nextTryAt=0; lastErr=null; fatal=null; lastSyncAt=Date.now();
    }catch(err){
      lastErr=err&&err.code||"errore";
      if(lastErr==="quota_exceeded"||lastErr==="resource-exhausted") fatal="Limite giornaliero del piano gratuito raggiunto: le modifiche restano sul telefono e ripartono più tardi.";
      if(lastErr==="permission-denied") fatal="Il tuo account non ha accesso ai dati: chiedi all'allenatore responsabile.";
      const slow=lastErr==="quota_exceeded"||lastErr==="resource-exhausted"||lastErr==="permission-denied";
      backoff=slow?300000:Math.min(backoff?backoff*2:3000,60000); nextTryAt=Date.now()+backoff; kick(backoff);
    }finally{ flushing=false; saveCache(); emit("data"); if(pending()&&!timer) kick(Math.max(0,nextTryAt-Date.now())||3000) }
  }
  function recoverOld(){
    const old=lsGet(K.oldEx,null); let n=0;
    if(Array.isArray(old)){
      for(const raw of old){ const c=cleanEx(raw); if(!c) continue; const s=server.items[c.id];
        if(!s||+c.updatedAt>+s.updatedAt){ out.seq++; out.docs["exercises/"+c.id]={seq:out.seq,op:"set",body:bodyOf(c),ts:Date.now()}; n++ } }
      lsDel(K.oldEx);
    }
    const ot=lsGet(K.oldTax,null);
    if(ot&&Array.isArray(ot.groups)){ ot.groups.forEach(g=>(g.tags||[]).forEach(t=>{ if(t&&typeof t.id==="string"&&!DEFAULT_TAG_IDS.has(t.id)){ out.seq++; out.tax.push({seq:out.seq,t:"add",g:g.id,id:t.id,l:String(t.l||"").slice(0,40)}) } })); lsDel(K.oldTax) }
    if(n||ot){ saveOut(); recompute(); if(n) toast(`Recuperati ${n} esercizi rimasti solo sul telefono`) }
  }
  function subscribe(){
    db.collection("exercises").onSnapshot(s=>{ if(fatal&&/accesso ai dati/.test(fatal)) fatal=null;
      const first=server.items===null; const m={};
      s.docs.forEach(d=>{const c=cleanEx(d.data(),d.id); if(c) m[d.id]=c});
      server.items=m; conn="online"; ready=true; lastSyncAt=Date.now();
      if(first) recoverOld();
      recompute(); saveCache(); emit("data"); kickSoon();
    },e=>{ if(e&&e.code==="permission-denied"){ conn="lost"; fatal="Il tuo account non ha accesso ai dati: chiedi all'allenatore responsabile."; emit("status"); return }
      conn="lost"; emit("status"); setTimeout(()=>{ if(conn==="lost"){ conn="connecting"; try{subscribe()}catch{} } },8000) },
    ()=>{ if(conn==="online"){ conn="connecting"; emit("status") } }); // rete persa: si torna a "Collegamento…"
    db.collection("plays").onSnapshot(s=>{
      const m={}; s.docs.forEach(d=>{const c=cleanPlay(d.data(),d.id); if(c) m[d.id]=c});
      server.plays=m; recompute(); saveCache(); emit("data"); kickSoon();
    },()=>{});
    db.collection("log").onSnapshot(s=>{
      const m={}; s.docs.forEach(d=>{const c=cleanLog(d.data(),d.id); if(c) m[d.id]=c});
      server.log=m; recompute(); saveCache(); emit("data"); kickSoon();
    },()=>{});
    db.collection("config").onSnapshot(s=>{
      const tax=s.docs.find(d=>d.id==="taxonomy"), bk=s.docs.find(d=>d.id==="backup");
      server.tax=tax?tax.data():null; server.backup=bk?bk.data():null;
      recompute(); saveCache(); emit("data"); kickSoon();
    },()=>{});
  }
  async function init(){
    if(cache&&cache.items) ready=true;
    recompute(); emit("data");
    let d=null;
    try{ conn="connecting"; emit("status"); d=await Cloud.db() }catch{d=null}
    if(!d){ conn="offline"; ready=true; recompute(); emit("data"); return }
    db=d; try{ subscribe() }catch{ conn="offline"; ready=true; emit("data") }
    const again=()=>{ if(document.visibilityState!=="hidden"){ backoff=0; nextTryAt=0; kick(0) } };
    addEventListener("online",again); document.addEventListener("visibilitychange",again);
  }
  function status(){
    const n=pending();
    if(fatal) return {tone:"err",label:"Errore invio",n,text:fatal};
    if(outboxFull) return {tone:"err",label:"Memoria piena",n,text:"La memoria del telefono è piena: le nuove modifiche potrebbero non essere conservate. Esporta un backup."};
    if(conn==="offline") return n?{tone:"wait",label:"Non connesso",n,text:`${n} ${n===1?"modifica è salvata":"modifiche sono salvate"} sul telefono. Il server non è raggiungibile: riapri l'app quando hai rete per inviarle.`}
      :{tone:"off",label:"Non connesso",n,text:"Il server non è raggiungibile. Vedi l'ultima copia salvata sul telefono; quello che modifichi resta sul telefono e parte quando riapri l'app con la rete."};
    if(conn!=="online") return n?{tone:"wait",label:"In attesa",n,text:`${n} ${n===1?"modifica salvata":"modifiche salvate"} sul telefono, in attesa del server.`}
      :{tone:"off",label:"Collegamento…",n,text:"Mostro l'ultima copia salvata sul telefono mentre mi collego al server."};
    if(flushing&&n) return {tone:"wait",label:"Invio…",n,text:`Sto inviando ${n} ${n===1?"modifica":"modifiche"} al server.`};
    if(n) return {tone:"wait",label:"Da inviare",n,text:`${n} ${n===1?"modifica salvata":"modifiche salvate"} sul telefono. Riprovo l'invio in automatico appena la rete risponde.`};
    return {tone:"ok",label:"Sincronizzato",n:0,text:"Tutto salvato sul server."};
  }
  return {
    init, status, sub:f=>(subs.add(f),()=>subs.delete(f)),
    get items(){return view}, byId:id=>viewMap[id], get ready(){return ready}, get taxKnown(){return baseTax()!==undefined},
    get lastSyncAt(){return lastSyncAt}, get connected(){return conn==="online"}, get offline(){return conn==="offline"},
    get backupAt(){const b=server.backup!==undefined?server.backup:(cache&&cache.backup); const p=out.docs["config/backup"]; return Math.max(+(b&&b.lastAt)||0,+(p&&p.body&&p.body.lastAt)||0)},
    put(ex){ const c=cleanEx(ex); if(!c) return false; enqueueDoc("exercises/"+c.id,"set",bodyOf(c)); return true },
    del(id){ enqueueDoc("exercises/"+id,"del") },
    get logs(){return logView},
    get plays(){return playView}, playById:id=>playMap[id],
    putPlays(list){ let n=0; for(const p of list){ const c=cleanPlay(p); if(!c) continue; const {id,...body}=c; out.seq++; out.docs["plays/"+id]={seq:out.seq,op:"set",body,ts:Date.now()}; n++ } saveOut(); recompute(); emit("data"); kick(0); return n },
    delPlay(id){ enqueueDoc("plays/"+id,"del") },
    putLogs(list){ for(const l of list){ const c=cleanLog(l); if(!c) continue; const {id,...body}=c; out.seq++; out.docs["log/"+id]={seq:out.seq,op:"set",body,ts:Date.now()} } saveOut(); recompute(); emit("data"); kick(0) },
    delLogs(ids){ for(const id of ids){ out.seq++; out.docs["log/"+id]={seq:out.seq,op:"del",ts:Date.now()} } saveOut(); recompute(); emit("data"); kick(0) },
    putMany(list){ let n=0; for(const ex of list){ const c=cleanEx(ex); if(!c) continue; out.seq++; out.docs["exercises/"+c.id]={seq:out.seq,op:"set",body:bodyOf(c),ts:Date.now()}; n++ } saveOut(); recompute(); emit("data"); kick(0); return n },
    taxOp(o){ out.seq++; out.tax.push({...o,seq:out.seq}); saveOut(); recompute(); emit("data"); kick(0) },
    setBackupAt(ts){ enqueueDoc("config/backup","set",{lastAt:ts}) },
    retry(){ backoff=0; nextTryAt=0; fatal=null; kick(0) }
  };
})();
function addTagTo(gid,label){
  label=String(label||"").trim().replace(/\s+/g," ").slice(0,40); if(!label) return null;
  const g=TAX.groups.find(x=>x.id===gid); if(!g) return null;
  const ex=g.tags.find(x=>x.l.toLowerCase()===label.toLowerCase()); if(ex) return {id:ex.id,existed:true};
  const id=uid("t"); Store.taxOp({t:"add",g:gid,id,l:label}); return {id,existed:false};
}

/* ================= BOZZE ================= */
function makeDrafts(K){
  let t=null;
  return {
    save(d,kind="form"){ clearTimeout(t); t=setTimeout(()=>lsSet(K,{d:clone(d),kind,at:Date.now()}),250) },
    now(d,kind="form"){ clearTimeout(t); lsSet(K,{d:clone(d),kind,at:Date.now()}) },
    get(){ const v=lsGet(K,null); return v&&v.d&&typeof v.d==="object"?v:null },
    clear(){ clearTimeout(t); lsDel(K) }
  };
}
const Drafts=makeDrafts("qtr.draft.v2"), PDrafts=makeDrafts("qtr.draft.play");
</script>
<script>
"use strict";
/* ================= LAVAGNA: disegno =================
   Un solo campo: la metà campo in coordinate "mondo" 400×300 (5,6 unità al metro), linea di meta in alto,
   attacco verso l'alto. X = metri dalla linea laterale sinistra (0–70), D = metri dalla linea di meta (0–50).
   Ogni lavagna salva la sua inquadratura (view: centro x,y e zoom z). Pedine, frecce e scritte hanno sempre
   la stessa grandezza a schermo, qualunque sia lo zoom: zoomando si allargano solo le distanze. */
const BW=400, BH=300, KM=5.6, ZMAX=8;
const W={x:X=>4+KM*X, y:D=>12+KM*D, X:x=>(x-4)/KM, D:y=>(y-12)/KM};
const ITEM_TYPES={
  att:{l:"Attaccante",icon:"att"}, sh:{l:"Mediano (9)",icon:"nine"}, def:{l:"Difensore",icon:"def"}, cone:{l:"Cono",icon:"cone"},
  ball:{l:"Pallone",icon:"ball"}, shield:{l:"Scudo",icon:"shield"}
};
const DEF_VIEW={x:200,y:150,z:1};
function emptyBoard(){return {bg:"pitch",items:[],lines:[],areas:[],view:{...DEF_VIEW}}}
function clampView(v){
  v=v||DEF_VIEW; const z=Math.max(1,Math.min(ZMAX,+v.z||1)), hw=BW/2/z, hh=BH/2/z;
  const x=Number.isFinite(+v.x)?+v.x:200, y=Number.isFinite(+v.y)?+v.y:150;
  return {x:Math.max(hw,Math.min(BW-hw,x)),y:Math.max(hh,Math.min(BH-hh,y)),z};
}
const viewRect=v=>({x0:v.x-BW/2/v.z,y0:v.y-BH/2/v.z,x1:v.x+BW/2/v.z,y1:v.y+BH/2/v.z});
/* inquadra un rettangolo del mondo lasciando un margine (frazione del lato) */
function fitRect(r,margin=.12){
  const w=Math.max(r.x1-r.x0,4), h=Math.max(r.y1-r.y0,4);
  return clampView({x:(r.x0+r.x1)/2,y:(r.y0+r.y1)/2,z:Math.min(BW/(w*(1+2*margin)),BH/(h*(1+2*margin)))});
}
const unionRect=(a,b)=>!a?b:!b?a:{x0:Math.min(a.x0,b.x0),y0:Math.min(a.y0,b.y0),x1:Math.max(a.x1,b.x1),y1:Math.max(a.y1,b.y1)};
function areaRect(a){const hw=a.w*KM/2, hh=a.h*KM/2;return {x0:a.x-hw,y0:a.y-hh,x1:a.x+hw,y1:a.y+hh}}
function areaCorners(a){const r=areaRect(a);return [[r.x0,r.y0],[r.x1,r.y0],[r.x1,r.y1],[r.x0,r.y1]]}
/* tutto ciò che è disegnato; pad = mezza pedina in unità mondo */
function contentRect(b,pad=0){
  let r=null; const add=(x,y,p)=>{r=unionRect(r,{x0:x-p,y0:y-p,x1:x+p,y1:y+p})};
  (b.items||[]).forEach(i=>add(+i.x,+i.y,pad)); (b.lines||[]).forEach(l=>{add(+l.x1,+l.y1,pad/2);add(+l.x2,+l.y2,pad/2)});
  (b.areas||[]).forEach(a=>{r=unionRect(r,areaRect(a))});
  return r;
}
/* inquadratura che mostra tutto il disegno (due passaggi: la mezza pedina dipende dallo zoom) */
function fitContent(b){
  let r=contentRect(b,14); if(!r) return {...DEF_VIEW};
  let v=fitRect(r,.1); r=contentRect(b,15/v.z); return fitRect(r,.1);
}
const fmtM=v=>String(+(+v).toFixed(1)).replace(".",",");
const areaLabel=a=>`${fmtM(a.w)} × ${fmtM(a.h)} m`;

/* Lavagne salvate prima del campo unico: stesse posizioni in campo, linea di meta in alto */
const LEGACY={
  side:{pt:(x,y)=>[W.x((x-8)/10.8),W.y((282-y)/10.8)],view:{x:103.6,y:80.4,z:1.929}},   // esercizi, vista laterale (meta in basso)
  half:{pt:(x,y)=>[x,300-y],view:DEF_VIEW},                                              // esercizi, campo (meta in basso)
  halfup:{pt:(x,y)=>[x,y],view:DEF_VIEW},                                                // schemi, campo
  sideup:{pt:(x,y)=>[W.x((x-8)/10.8),W.y((y-18)/10.8)],view:{x:103.6,y:80.4,z:1.929}},  // schemi, laterale sinistra
  sideupr:{pt:(x,y)=>[W.x((x+364)/10.8),W.y((y-18)/10.8)],view:{x:296.4,y:80.4,z:1.929}} // schemi, laterale destra
};
const legacyOf=bg=>bg==="pitch"?null:(LEGACY[bg]||LEGACY.side);
function legacyPt(L,x,y){const [a,c]=L.pt(+x,+y);return [+(+a).toFixed(1),+(+c).toFixed(1)]}
function upgradeBoard(b){
  const L=legacyOf(b.bg); if(!L) return b;
  const arr=a=>Array.isArray(a)?a:[];
  return {bg:"pitch",
    items:arr(b.items).map(i=>{if(!i||typeof i!=="object")return i;const [x,y]=legacyPt(L,i.x,i.y);return {...i,x,y}}),
    lines:arr(b.lines).map(l=>{if(!l||typeof l!=="object")return l;const [x1,y1]=legacyPt(L,l.x1,l.y1),[x2,y2]=legacyPt(L,l.x2,l.y2);return {...l,x1,y1,x2,y2}}),
    areas:[],view:{...L.view}};
}

const f2=n=>(+n).toFixed(2);
function bgSVG(v){
  const s=1/v.z, r=viewRect(v);
  const TX=(x,y,t,a="start")=>`<text x="${f2(x)}" y="${f2(y)}" text-anchor="${a}" fill="rgba(255,255,255,.62)" font-family="IBM Plex Mono,monospace" font-size="${f2(9*s)}">${t}</text>`;
  const ln=(x1,x2,y1,y2,st)=>`<line x1="${f2(x1)}" x2="${f2(x2)}" y1="${f2(y1)}" y2="${f2(y2)}" ${st}/>`;
  const L=`stroke="rgba(255,255,255,.8)" stroke-width="${f2(1.7*s)}" fill="none"`, D=`stroke="rgba(255,255,255,.6)" stroke-width="${f2(1.35*s)}" stroke-dasharray="${f2(7*s)} ${f2(6*s)}" fill="none"`;
  let o="";
  for(let i=0;i<10;i++) o+=`<rect x="0" y="${i*30}" width="${BW}" height="30" style="fill:${i%2?"var(--pitch-2)":"var(--pitch)"}"/>`;
  const x0=W.x(0), x1=W.x(70), yT=W.y(0), yH=W.y(50);
  o+=`<rect x="0" y="0" width="${BW}" height="${yT}" fill="rgba(0,0,0,.14)"/>`;
  o+=`<rect x="${x0}" y="${yT}" width="${f2(x1-x0)}" height="${f2(yH-yT)}" ${L}/>`;
  o+=ln(x0,x1,W.y(40),W.y(40),D)+ln(x0,x1,W.y(22),W.y(22),L)+ln(x0,x1,W.y(5),W.y(5),D);
  [5,15,55,65].forEach(m=>o+=ln(W.x(m),W.x(m),yT,yH,D+' opacity=".7"'));
  const cx=W.x(35), pw=2.8*KM;
  o+=`<path d="M${f2(cx-pw)} ${f2(yT-9)}V${f2(yT)}M${f2(cx+pw)} ${f2(yT-9)}V${f2(yT)}M${f2(cx-pw)} ${f2(yT-4)}H${f2(cx+pw)}" stroke="#fff" stroke-width="${f2(2.4*s)}" fill="none"/>`;
  /* scritte sempre dentro l'inquadratura */
  const xr=Math.min(x1,r.x1)-6*s;
  [[40,"10"],[22,"22"],[5,"5"],[0,"META"]].forEach(([d,t])=>{const y=W.y(d)+11*s; if(y<=r.y1-2*s&&y>=r.y0+8*s) o+=TX(xr,y,t,"end")});
  if(v.z>=1.4){ const yt=Math.max(yT,r.y0)+11*s; // in alto, così in basso resta libera la scala in metri
    [[5,"5 m","start"],[15,"15 m","start"],[55,"15 m","end"],[65,"5 m","end"]].forEach(([m,t,a])=>{const x=W.x(m); if(x>=r.x0&&x<=r.x1) o+=TX(x+(a==="start"?4:-4)*s,yt,t,a)}) }
  const ym=yH-5*s; if(ym>=r.y0+8*s&&ym<=r.y1) o+=TX(Math.max(r.x0+40*s,Math.min(r.x1-40*s,200)),ym,"METÀ CAMPO","middle");
  return o;
}
function areaSVG(a,s,o={}){
  const r=areaRect(a), w=r.x1-r.x0, h=r.y1-r.y0, lab=areaLabel(a), fs=10*s, pad=4*s, tw=lab.length*fs*.6+pad*2, th=fs+pad*1.7;
  const inside=tw<w-4*s&&th<h-4*s, lx=r.x0+(inside?3*s:0), ly=inside?r.y0+3*s:r.y0-th-2*s;
  return `<g class="barea${o.sel?" sel":""}" data-area="${esc(a.id)}"><rect x="${f2(r.x0)}" y="${f2(r.y0)}" width="${f2(w)}" height="${f2(h)}" fill="rgba(255,255,255,.17)" stroke="rgba(255,255,255,.92)" stroke-width="${f2((o.sel?2.2:1.6)*s)}"${o.sel?` stroke-dasharray="${f2(6*s)} ${f2(4*s)}"`:""}/>`+
    `<rect x="${f2(lx)}" y="${f2(ly)}" width="${f2(tw)}" height="${f2(th)}" rx="${f2(3*s)}" fill="rgba(6,16,11,.55)"/><text x="${f2(lx+pad)}" y="${f2(ly+th/2+fs*.36)}" fill="#fff" font-family="IBM Plex Mono,monospace" font-weight="500" font-size="${f2(fs)}">${esc(lab)}</text></g>`;
}
/* punta della freccia: L lunghezza, incavo dietro; la linea finisce dentro la punta, così non spunta sopra */
function arrowGeom(x1,y1,x2,y2,s){
  const d=Math.hypot(x2-x1,y2-y1)||1, ux=(x2-x1)/d, uy=(y2-y1)/d, nx=-uy, ny=ux, L=Math.min(11*s,d*.5), W=L*.5;
  const bx=x2-ux*L, by=y2-uy*L, kx=x2-ux*L*.7, ky=y2-uy*L*.7;
  return {head:`M${f2(x2)} ${f2(y2)}L${f2(bx+nx*W)} ${f2(by+ny*W)}L${f2(kx)} ${f2(ky)}L${f2(bx-nx*W)} ${f2(by-ny*W)}Z`,ex:x2-ux*L*.78,ey:y2-uy*L*.78};
}
function arrowHead(x1,y1,x2,y2,size=9){ return arrowGeom(x1,y1,x2,y2,size/11).head }
function lineSVG(l,o={}){
  const s=o.s||1, col=l.t==="pass"?"var(--pass)":"#fff";
  const dash=l.t==="pass"?` stroke-dasharray="${f2(6*s)} ${f2(4.5*s)}"`:"";
  const len=Math.hypot(l.x2-l.x1,l.y2-l.y1); if(len<2*s) return "";
  const g=arrowGeom(+l.x1,+l.y1,+l.x2,+l.y2,s);
  return `<g class="bline${o.sel?" sel":""}" data-line="${esc(l.id)}">`+
    (o.edit?`<line x1="${+l.x1}" y1="${+l.y1}" x2="${+l.x2}" y2="${+l.y2}" stroke="transparent" stroke-width="${f2(18*s)}"/>`:"")+
    `<line x1="${f2(l.x1)}" y1="${f2(l.y1)}" x2="${f2(g.ex)}" y2="${f2(g.ey)}" style="stroke:${col}" stroke-width="${f2(2.3*s)}" stroke-linecap="round"${dash}/>`+
    `<path d="${g.head}" style="fill:${col}" stroke-linejoin="round"/></g>`;
}
/* frecce visibili o nascoste nelle viste di sola lettura (preferenza del telefono) */
const arrowsOn=()=>lsGet("qtr.arrows",true)!==false;
const arrowsBtn=(on=arrowsOn())=>`<button type="button" class="arrowsw" data-arrows aria-pressed="${on}" aria-label="Frecce ${on?"visibili":"nascoste"}"><span class="sw" aria-hidden="true"></span>Frecce</button>`;
function itemSVG(it,o={}){
  let g="";
  const lbl=(n,fs=12.5)=>n!=null?`<text y="${(fs*.36).toFixed(1)}" text-anchor="middle" fill="#fff" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="${fs}">${esc(n)}</text>`:"";
  if(it.t==="att") g=`<circle r="11.5" style="fill:var(--att)" stroke="#fff" stroke-width="1.7"/>${lbl(it.n)}`;

  else if(it.t==="def") g=`<rect x="-11" y="-11" width="22" height="22" rx="4" style="fill:var(--def)" stroke="#fff" stroke-width="1.7"/>${lbl(it.n)}`;
  else if(it.t==="cone") g=`<path d="M0 -9.5L8.6 7.8H-8.6Z" style="fill:var(--cone)" stroke="rgba(0,0,0,.3)" stroke-width=".8"/><path d="M-4.3 -.9H4.3" stroke="#fff" stroke-width="1.8"/>`;
  else if(it.t==="ball") g=`<ellipse rx="9.5" ry="6" transform="rotate(-30)" fill="#F3EEE2" stroke="#5E4E33" stroke-width="1.1"/><path d="M-4 2.4 4 -2.4" stroke="#5E4E33" stroke-width="1.1"/>`;
  else if(it.t==="shield") g=`<rect x="-7" y="-12.5" width="14" height="25" rx="3.6" style="fill:var(--shield)" stroke="#fff" stroke-width="1.3"/><path d="M-3.5 -6h7M-3.5 6h7" stroke="#fff" stroke-width="1" opacity=".8"/>`;
  const hit=o.edit?`<circle r="19" fill="transparent"/>`:"";
  const halo=o.sel?`<circle class="halo" r="19"/>`:"";
  return `<g class="bitem${o.sel?" sel":""}" data-item="${esc(it.id)}" transform="translate(${f2(it.x)} ${f2(it.y)}) scale(${(o.s||1).toFixed(4)})"><g${o.fresh?' class="placed"':""}>${hit}${halo}${g}</g></g>`;
}
function boardSVG(b,o={}){
  b=b||emptyBoard(); if(b.bg!=="pitch") b=cleanBoard(b);
  const v=clampView(o.view||b.view), s=1/v.z, r=viewRect(v);
  const areas=(b.areas||[]).map(a=>areaSVG(a,s,{sel:o.sel===a.id})).join("");
  const showL=o.edit||(o.arrows??arrowsOn());
  const lines=showL?(b.lines||[]).map(l=>lineSVG(l,{edit:o.edit,sel:o.sel===l.id,s})).join(""):"";
  const order={cone:0,shield:1,def:2,att:3,sh:3,ball:4};
  const items=[...(b.items||[])].sort((a,c)=>(order[a.t]??0)-(order[c.t]??0)).map(it=>itemSVG(it,{edit:o.edit,sel:o.sel===it.id,fresh:o.fresh===it.id,s})).join("");
  const label=o.label?` role="img" aria-label="${esc(o.label)}"`:' aria-hidden="true"';
  return `<svg viewBox="${f2(r.x0)} ${f2(r.y0)} ${f2(r.x1-r.x0)} ${f2(r.y1-r.y0)}" preserveAspectRatio="xMidYMid meet"${label}${o.id?` id="${o.id}"`:""}><g class="bg">${bgSVG(v)}</g><g class="areas">${areas}</g>${o.under||""}<g class="lines">${lines}</g><g class="items">${items}</g>${o.preview?`<g class="guides"></g><g class="preview"></g>`:""}</svg>`;
}
function boardCounts(b){
  const c={att:0,sh:0,def:0,cone:0,ball:0,shield:0};
  (b?.items||[]).forEach(i=>{if(c[i.t]!=null)c[i.t]++});
  return c;
}
function autoPlayers(b){const c=boardCounts(b);return {att:c.att+c.sh,def:c.def,auto:true}}
/* testo "Spazio" ricavato dalla prima area disegnata */
const AREA_TXT_RE=/^\d+(?:[.,]\d+)? × \d+(?:[.,]\d+)? m$/;
function syncAreaText(cur,oldBoard,nb){
  const a=(nb.areas||[])[0], prev=(oldBoard&&oldBoard.areas||[])[0];
  if(a&&(!cur||AREA_TXT_RE.test(cur))) return areaLabel(a);
  if(!a&&prev&&cur===areaLabel(prev)) return "";
  return cur||"";
}
</script>
<script>
"use strict";
/* ================= LAVAGNA: editor =================
   Campo unico con zoom fino a 8×, area dell'esercizio in metri, interruttore Allinea
   (ogni pedina va sulla riga o sulla colonna della pedina più vicina), selezione precisa, annulla/ripristina. */
const TOOLS=[
  {id:"att",l:"Attacco",icon:"att",hint:"Tocca il campo per mettere un attaccante; tieni giù il dito e trascina per sistemarlo."},
  {id:"sh",l:"Mediano",icon:"nine",hint:"Tocca il campo per mettere il 9, il mediano che gioca dal punto d'incontro. Conta tra gli attaccanti."},
  {id:"def",l:"Difesa",icon:"def",hint:"Tocca il campo per mettere un difensore; tieni giù il dito e trascina per sistemarlo."},
  {id:"cone",l:"Cono",icon:"cone",hint:"Tocca il campo per mettere i coni."},
  {id:"ball",l:"Palla",icon:"ball",hint:"Tocca il campo per mettere un pallone."},
  {id:"shield",l:"Scudo",icon:"shield",hint:"Tocca il campo per mettere uno scudo da impatto."},
  {id:"move",l:"Sposta",icon:"hand",wide:1,hint:"Trascina per spostare, tocca per selezionare. Con lo zoom, trascina il campo vuoto per scorrere."},
  {id:"run",l:"Corsa",icon:"run",wide:1,hint:"Trascina dal punto di partenza a quello di arrivo della corsa."},

const ZSTEPS=[1,1.5,2,3,4,6,8];
const AREA_PRESETS=[[5,5],[10,10],[15,10],[20,15],[22,15],[30,20]];
const parseM=s=>{const v=parseFloat(String(s??"").trim().replace(",","."));return Number.isFinite(v)?v:NaN};
const roundView=v=>({x:+v.x.toFixed(1),y:+v.y.toFixed(1),z:+v.z.toFixed(3)});
function openBoardEditor(initial,onDone,onChange,onCancel,opts={}){
  let b=clone(initial&&initial.bg==="pitch"?initial:cleanBoard(initial||emptyBoard()));
  b.items=b.items||[]; b.lines=b.lines||[]; b.areas=b.areas||[];

  const hist=[], fut=[]; let touched=false, tool="move", sel=null, fresh=null, drag=null, draft=null, pan=null, pinch=null, block=false, armClose=0, armClear=0;
  const pts=new Map(), reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const layer=$("#layer");
  const el=document.createElement("div"); el.className="editor"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","Lavagna tattica");
  el.innerHTML=`<div class="ebar">
      <button class="iconbtn" data-a="close" aria-label="Esci senza salvare">${ico("close")}</button>
      <button class="snapbtn" data-a="snap" aria-pressed="false" title="Ogni pedina va sulla riga o sulla colonna della pedina più vicina"><span class="sw" aria-hidden="true"></span>Allinea</button>
      <span class="espacer"></span>
      <button class="iconbtn" data-a="undo" aria-label="Annulla">${ico("undo2")}</button>
      <button class="iconbtn" data-a="redo" aria-label="Ripristina">${ico("redo")}</button>
      <button class="btn primary efatto" data-a="done">${ico("check")}Fatto</button>
    </div>
    <div class="estage"><div class="bwrap"><div class="bsvg"></div>
      <div class="scalebar" aria-hidden="true"><i></i><span></span></div>
      <div class="zoomctl" role="group" aria-label="Zoom"><button data-z="-1" aria-label="Riduci zoom">−</button><button data-z="0" class="zlabel" aria-label="Mostra tutto il campo">100%</button><button data-z="1" aria-label="Aumenta zoom">+</button><button data-z="fit" aria-label="Inquadra il disegno">${ico("fit")}</button></div></div></div>
    <div class="eside">
      <div class="ecount" aria-live="polite"></div>
      <div class="ehint"></div>
      <div class="erow"></div>
      <div class="tools" role="toolbar" aria-label="Strumenti">${TOOLS.map(t=>`<button class="tool${t.wide?" wide":""}" data-tool="${t.id}" aria-pressed="false" title="${esc(t.l)}">${ico(t.icon)}<span>${t.l}</span></button>`).join("")}</div>
    </div>`;
  layer.appendChild(el); document.body.style.overflow="hidden";
  const wrap=$(".bsvg",el);
  const svg=()=>wrap.firstElementChild;

  /* --- cronologia --- */
  const push=()=>{touched=true;hist.push(clone(b));if(hist.length>100)hist.shift();fut.length=0};
  function undo(){ if(!hist.length) return; fut.push(clone(b)); b=hist.pop(); sel=null; repaint() }
  function redo(){ if(!fut.length) return; hist.push(clone(b)); b=fut.pop(); sel=null; repaint() }

  /* --- vista --- */
  const pxPerUnit=()=>{const r=svg().getBoundingClientRect();return r.width/(BW/v.z)};
  function toPt(cx,cy,clamp=true){const s=svg(),p=s.createSVGPoint();p.x=cx;p.y=cy;const q=p.matrixTransform(s.getScreenCTM().inverse());return clamp?{x:Math.max(4,Math.min(BW-4,q.x)),y:Math.max(4,Math.min(BH-4,q.y))}:{x:q.x,y:q.y}}
  const schedule=()=>{ if(!raf) raf=requestAnimationFrame(()=>{raf=0;paintBoard()}) };
  const flush=()=>{ if(raf){cancelAnimationFrame(raf);raf=0;paintBoard()} };
  function stopTween(){ if(tw){cancelAnimationFrame(tw);tw=0} }
  function animateTo(t){
    stopTween(); t=clampView(t);
    if(reduce){v=t;paintBoard();return}
    const a={...v}, t0=performance.now(), D=220;
    const step=now=>{const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3); v=clampView({x:a.x+(t.x-a.x)*e,y:a.y+(t.y-a.y)*e,z:a.z+(t.z-a.z)*e}); paintBoard(); tw=k<1?requestAnimationFrame(step):0};
    tw=requestAnimationFrame(step);
  }
  function zoomAt(nz,cx,cy,anim){
    const r0=viewRect(v), fx=(cx-r0.x0)/(r0.x1-r0.x0), fy=(cy-r0.y0)/(r0.y1-r0.y0), z=Math.max(1,Math.min(ZMAX,nz)), w=BW/z, h=BH/z;
    const t={x:cx-fx*w+w/2,y:cy-fy*h+h/2,z}; if(anim) animateTo(t); else {v=clampView(t);schedule()}
  }
  function paintZoomUI(){
    $(".zlabel",el).textContent=Math.round(v.z*100)+"%";
    const s=svg(); if(!s) return; const pxm=s.getBoundingClientRect().width/(BW/v.z)*KM; if(!pxm) return;
    const L=[1,2,5,10,20].find(m=>m*pxm>=34)||20, sb=$(".scalebar",el);
    sb.querySelector("i").style.width=(L*pxm).toFixed(1)+"px"; sb.querySelector("span").textContent=L+" m";
  }

  /* --- disegno --- */
  function nextN(t){
    if(opts.backs){ const used=new Set(b.items.filter(i=>i.t===t).map(i=>+i.n)); const free=(t==="att"?[10,11,12,13,14,15]:[9,10,11,12,13,14,15]).find(n=>!used.has(n)); if(free) return free }
    return (b.items.filter(i=>i.t===t).reduce((m,i)=>Math.max(m,+i.n||0),0))+1}
  function paintGuides(){
    const g=svg()&&svg().querySelector(".guides"); if(!g) return; const r=viewRect(v), s=1/v.z;
    const st=`style="stroke:var(--pass)" stroke-width="${f2(1.4*s)}" stroke-dasharray="${f2(5*s)} ${f2(3.5*s)}"`;
    g.innerHTML=guides.map(q=>q.k==="v"?`<line x1="${f2(q.at)}" x2="${f2(q.at)}" y1="${f2(r.y0)}" y2="${f2(r.y1)}" ${st}/>`:`<line x1="${f2(r.x0)}" x2="${f2(r.x1)}" y1="${f2(q.at)}" y2="${f2(q.at)}" ${st}/>`).join("");
  }
  function paintBoard(){wrap.innerHTML=boardSVG(b,{edit:true,sel,fresh,preview:true,view:v,label:opts.views?"Lavagna dello schema":"Lavagna dell'esercizio"}); fresh=null; paintGuides(); paintZoomUI()}
  function paintUI(){
    const c=boardCounts(b);
    const part=(n,s,p)=>`<span><b>${n}</b> ${n===1?s:p}</span>`;
    $(".ecount",el).innerHTML=part(c.att,"attaccante","attaccanti")+(c.sh?part(c.sh,"mediano","mediani"):"")+part(c.def,"difensore","difensori")+
      (c.cone?part(c.cone,"cono","coni"):"")+(c.ball?part(c.ball,"pallone","palloni"):"")+(c.shield?part(c.shield,"scudo","scudi"):"")+(b.lines.length?part(b.lines.length,"freccia","frecce"):"")+
      (b.areas.length?part(b.areas.length,"area","aree"):"");
    const selA=sel&&b.areas.find(a=>a.id===sel);
    $(".ehint",el).textContent=selA?"Trascina l'area per spostarla; misure, rotazione e coni qui sotto. Tocca fuori dall'area per finire."
      :(TOOLS.find(t=>t.id===tool).hint+(snap&&ITEM_TYPES[tool]?" Allinea è attivo.":""));
    el.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.tool===tool)));
    $('[data-a="snap"]',el).setAttribute("aria-pressed",String(snap));
    const u=$('[data-a="undo"]',el), r=$('[data-a="redo"]',el); u.disabled=!hist.length; r.disabled=!fut.length;
    const row=$(".erow",el);
    if(selA){
      const nc=b.items.filter(i=>i.ar===selA.id).length;
      row.innerHTML=`<button class="btn ghost" data-a="adims" aria-label="Cambia le misure dell'area">${ico("edit")}<span class="mono">${esc(areaLabel(selA))}</span></button>`+
        `<button class="btn ghost" data-a="arot">${ico("rotate")}Ruota</button>`+
        `<button class="btn ghost" data-a="acones" aria-label="${nc?"Togli i coni dagli angoli":"Metti un cono in ogni angolo"}">${ico("cone")}${nc?"Togli coni":"Coni"}</button>`+
        `<button class="btn ghost" data-a="dup">${ico("copy")}Duplica</button><button class="btn ghost" data-a="del" style="color:var(--danger)">${ico("trash")}Elimina</button><button class="btn ghost" data-a="desel">Fine</button>`;
    }else if(sel){
      const isItem=b.items.some(i=>i.id===sel), it=b.items.find(i=>i.id===sel), numbered=it&&(it.t==="att"||it.t==="def");
      row.innerHTML=(numbered?`<div class="numstep" role="group" aria-label="Numero di maglia"><span>N°</span><button data-a="n-" aria-label="Numero più basso">−</button><output>${it.n??"–"}</output><button data-a="n+" aria-label="Numero più alto">+</button></div>`:"")+(isItem?`<button class="btn ghost" data-a="dup">${ico("copy")}Duplica</button>`:"")+`<button class="btn ghost" data-a="del" style="color:var(--danger)">${ico("trash")}Elimina</button><button class="btn ghost" data-a="desel">Fine</button>`;
    }else{
      const any=b.items.length||b.lines.length||b.areas.length;
      row.innerHTML=any?`<button class="btn ghost" data-a="clear">${ico("trash")}${armClear>Date.now()?"Tocca ancora":"Svuota"}</button><button class="btn ghost" data-a="mirror">${ico("mirror")}Specchia</button>`:"";
    }
  }
  const repaint=()=>{paintBoard();paintUI();if(onChange&&touched)onChange({...b,view:roundView(v)})};
  repaint();

  /* --- area --- */
  const inArea=(a,p)=>{const r=areaRect(a);return p.x>=r.x0&&p.x<=r.x1&&p.y>=r.y0&&p.y<=r.y1};
  const areaAt=p=>[...b.areas].reverse().find(a=>inArea(a,p))||null;
  function placeArea(a,cx,cy){
    const hw=a.w*KM/2, hh=a.h*KM/2;
    a.x=+(hw>=BW/2?BW/2:Math.max(hw,Math.min(BW-hw,cx))).toFixed(1); a.y=+(hh>=BH/2?BH/2:Math.max(hh,Math.min(BH-hh,cy))).toFixed(1);
  }
  /* se un'area esce dall'inquadratura (misure, rotazione, copia), la vista si riallarga per mostrarla tutta */
  function ensureVisible(r){ const vr=viewRect(v); if(r.x0<vr.x0-1||r.y0<vr.y0-1||r.x1>vr.x1+1||r.y1>vr.y1+1) animateTo(fitRect(r,.15)) }
  function syncCones(a){ const cs=areaCorners(a); b.items.forEach(i=>{ if(i.ar===a.id){ i.x=+cs[i.ck][0].toFixed(1); i.y=+cs[i.ck][1].toFixed(1) } }) }
  function addCones(a){ const cs=areaCorners(a); for(let k=0;k<4;k++) if(!b.items.some(i=>i.ar===a.id&&i.ck===k)) b.items.push({id:uid("i"),t:"cone",x:+cs[k][0].toFixed(1),y:+cs[k][1].toFixed(1),ar:a.id,ck:k}) }
  function openAreaDlg(a){
    const last=lsGet("qtr.lastArea",{w:15,h:10}), w0=a?a.w:(+last.w||15), h0=a?a.h:(+last.h||10);
    const dlg=document.createElement("div"); dlg.className="edlg";
    dlg.innerHTML=`<div class="edlg-card" role="dialog" aria-modal="true" aria-labelledby="adlg-t">
      <h3 id="adlg-t">${a?"Misure dell'area":"Area dell'esercizio"}</h3>
      <p class="edlg-note">${a?"Cambia le misure: l'area resta centrata dov'è.":"L'area compare al centro della vista: poi la trascini dove vuoi e metti i giocatori."}</p>
      <div class="dims"><label><span>Larghezza ↔</span><input id="aw" class="input" inputmode="decimal" enterkeyhint="next" value="${fmtM(w0)}" autocomplete="off" aria-label="Larghezza in metri"></label><b aria-hidden="true">×</b>
        <label><span>Profondità ↕</span><input id="ah" class="input" inputmode="decimal" enterkeyhint="done" value="${fmtM(h0)}" autocomplete="off" aria-label="Profondità in metri"></label><em>m</em></div>
      <div class="chipwrap">${AREA_PRESETS.map(([w,h])=>`<button type="button" class="chip" data-ap="${w}x${h}">${w} × ${h}</button>`).join("")}</div>
      ${a?"":`<label class="chk"><input type="checkbox" id="acones"${lsGet("qtr.areaCones",false)?" checked":""}><span>Un cono in ogni angolo</span></label>`}
      <span class="err" id="aerr" hidden>Scrivi due misure in metri: larghezza da 1 a 70, profondità da 1 a 50.</span>
      <div class="edlg-actions"><button type="button" class="btn ghost" data-ad="cancel">Annulla</button><button type="button" class="btn primary" data-ad="ok">${ico("check")}${a?"Aggiorna":"Inserisci"}</button></div>
    </div>`;
    el.appendChild(dlg);
    const aw=$("#aw",dlg), ah=$("#ah",dlg), err=$("#aerr",dlg);
    const shut=()=>{dlg.classList.add("closing");setTimeout(()=>dlg.remove(),160)};
    const ok=()=>{
      let w=parseM(aw.value), h=parseM(ah.value);
      const m=String(aw.value).match(/^\s*(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)/i); if(m){w=parseM(m[1]);h=parseM(m[2])} // anche "15x10" scritto in un campo solo
      if(!(w>=1&&w<=70&&h>=1&&h<=50)){err.hidden=false;return}
      w=Math.round(w*2)/2; h=Math.round(h*2)/2; lsSet("qtr.lastArea",{w,h});
