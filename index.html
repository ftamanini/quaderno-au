function bindPlayEdit(scr){
  const d=P.draft, mark=()=>{P.dirty=true;PDrafts.save(d)};
  const rerender=(focusSel)=>{const y=window.scrollY;renderScreen(null);window.scrollTo(0,y);if(focusSel){const el=$(focusSel);if(el)el.focus({preventScroll:true})}};
  const map={"p-name":"name","p-desc":"description","p-kp":"keyPoints","p-notes":"notes"};
  Object.entries(map).forEach(([id,k])=>$("#"+id,scr).addEventListener("input",e=>{d[k]=e.target.value;mark();if(k==="name")$("#pname-err").hidden=true}));
  scr.addEventListener("input",e=>{const t=e.target; if(t.dataset&&t.dataset.phf){const ph=d.phases[+t.dataset.i]; if(ph){ph[t.dataset.phf]=t.value;mark()}}});
  $("#pform",scr).addEventListener("submit",e=>e.preventDefault());
  scr.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const changeStart=fn=>{ if(!pristine(d)&&(P.armGen||0)<Date.now()){ P.armGen=Date.now()+3000; toast("Hai modificato la lavagna: tocca di nuovo per sostituirla","close"); return } P.armGen=0; fn(); applyStart(d); syncSituation(d); mark(); rerender() };
    const st=()=>({...START_DEF,...(d.start||{})});
    if(b.dataset.stype){const v=b.dataset.stype; return changeStart(()=>{d.start=d.start?{...st(),type:v}:{type:v,side:START_SIDE[v],def:true}; if(v==="lineout"&&d.start.side==="c") d.start.side="l"})}
    if(b.dataset.sside){const v=b.dataset.sside; return changeStart(()=>{d.start={...st(),side:v}})}
    if(b.hasAttribute("data-sdef")){ const s=st(); s.def=!s.def; const was=pristine(d); d.start=s;
      if(was) applyStart(d); else if(!s.def) d.board={...d.board,items:d.board.items.filter(i=>i.t!=="def")};
      else { const add=backsPreset(s,d.zones).items.filter(i=>i.t==="def"&&!d.board.items.some(x=>x.id===i.id)); d.board={...d.board,items:[...d.board.items,...add]} }
      mark(); return rerender() }
    if(b.dataset.psit){const id=b.dataset.psit;d.situation=d.situation===id?null:id;mark();scr.querySelectorAll("[data-psit]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.psit===d.situation)));return}
    if(b.dataset.pzone){const id=b.dataset.pzone, was=pristine(d);
      d.zones=d.zones.includes(id)?d.zones.filter(x=>x!==id):id==="tutto"?["tutto"]:[...d.zones.filter(x=>x!=="tutto"),id]; // "Tutto il campo" esclude le altre zone
      mark(); if(was&&d.start){applyStart(d);return rerender()}
      scr.querySelectorAll("[data-pzone]").forEach(x=>x.setAttribute("aria-pressed",String(d.zones.includes(x.dataset.pzone))));return}
    if(b.dataset.paddtag){
      const gid=b.dataset.paddtag, inp=document.createElement("input");
      inp.className="chip-input"; inp.maxLength=40; inp.placeholder=gid==="sit"?"Nuova situazione":"Nuova zona"; inp.setAttribute("enterkeyhint","done"); inp.setAttribute("aria-label",inp.placeholder);
      b.replaceWith(inp); inp.focus(); let done=false;
      const commit=()=>{ if(done) return; done=true; const r=addTagTo(gid,inp.value);
        if(r){ if(gid==="sit") d.situation=r.id; else if(!d.zones.includes(r.id)) d.zones=r.id==="tutto"?["tutto"]:[...d.zones.filter(x=>x!=="tutto"),r.id]; mark(); toast(r.existed?"Già presente: selezionata":"Aggiunta e selezionata") }
        rerender() };
      inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ev.preventDefault();commit()} else if(ev.key==="Escape"){ev.preventDefault();done=true;rerender()} });
      inp.addEventListener("blur",()=>{ if(!done) commit() });
      return;
    }
    if(b.hasAttribute("data-phadd")){ d.phases.push(newPhase(d.phases.length)); mark(); return rerender("#ph-t-"+(d.phases.length-1)) }
    if(b.dataset.phup!==undefined){const i=+b.dataset.phup; if(i>0){[d.phases[i-1],d.phases[i]]=[d.phases[i],d.phases[i-1]];mark();rerender()} return}
    if(b.dataset.phdown!==undefined){const i=+b.dataset.phdown; if(i<d.phases.length-1){[d.phases[i+1],d.phases[i]]=[d.phases[i],d.phases[i+1]];mark();rerender()} return}
    if(b.dataset.phdel!==undefined){const i=+b.dataset.phdel, ph=d.phases[i]; if(!ph) return; d.phases.splice(i,1); mark(); rerender();
      toast(`Fase ${i+1} eliminata`,"trash",{label:"Annulla",run:()=>{ if(P.draft!==d) return; d.phases.splice(i,0,ph); mark(); rerender() }}); return}
    if(b.hasAttribute("data-pboard")) return openBoardEditor(d.board,
      nb=>{d.board=nb;mark();rerender()}, nb=>PDrafts.save({...d,board:nb}), ()=>{ if(P.dirty) PDrafts.now(d); else PDrafts.clear() }, {backs:true,views:true});
    if(b.hasAttribute("data-pcancel")){
      if(P.dirty&&P.armBack<Date.now()){P.armBack=Date.now()+3000;toast("Modifiche non salvate: tocca di nuovo × per scartarle","close");return}
      const id=d._new?null:d.id; PDrafts.clear(); P.draft=null; P.dirty=false; return id&&Store.playById(id)?pgo("detail",id,"back"):pgo("list",null,"back");
    }
    if(b.hasAttribute("data-psave")){
      if(!d.name.trim()){$("#pname-err").hidden=false;$("#p-name").focus();$("#p-name").scrollIntoView({block:"center",behavior:"smooth"});return}
      if(!lock("psave")) return;
      const now=Date.now(), {_new,_genKey,...pl}=clone(d); pl.name=pl.name.trim(); pl.updatedAt=now; if(_new||!pl.createdAt) pl.createdAt=now;
      if(Store.taxKnown){ if(pl.situation&&!PTAG[pl.situation]) pl.situation=null; pl.zones=pl.zones.filter(z=>PTAG[z]) }
      if(!Store.putPlays([pl])){toast("Non riesco a salvare: controlla i campi","close");return}
      PDrafts.clear(); P.draft=null; P.dirty=false; toast(_new?"Schema creato":"Modifiche salvate"); pgo("detail",pl.id,"back");
    }
  });
}

/* --- navigazione della sezione --- */
function pgo(view,id=null,dir="fwd"){P.view=view;P.id=id;P.armBack=0;renderScreen(dir==="back"?"enter-back":"enter");window.scrollTo(0,0)}
function renderPlays(app,scr){
  if(P.view==="detail"){const p=Store.playById(P.id);
    if(!p){ if(Store.ready){P.view="list";return renderPlays(app,scr)} scr.innerHTML=`<div class="list" style="padding-top:16px"><div class="skel" style="height:240px"></div></div>`; app.replaceChildren(scr); return scr }
    P.lastKey=pkey(p); scr.innerHTML=playDetailHTML(p); app.replaceChildren(scr); bindPlayDetail(scr,p); return scr}
  if(P.view==="edit"&&P.draft){scr.innerHTML=playEditHTML(P.draft); app.replaceChildren(scr); bindPlayEdit(scr); return scr}
  P.view="list"; scr.innerHTML=playsListHTML(); app.replaceChildren(scr); bindPlaysList(scr); updatePlays(true);
  const fab=document.createElement("button"); fab.className="fab"; fab.innerHTML=ico("plus")+"Schema"; fab.setAttribute("aria-label","Nuovo schema"); fab.onclick=newPlay; document.body.appendChild(fab);
  return scr;
}
function playsOnData(){
  if($(".sheet")||$(".editor")) return;
  if(P.view==="list") updatePlays(false);
  else if(P.view==="detail"&&pkey(Store.playById(P.id))!==P.lastKey){const y=window.scrollY;renderScreen(null);window.scrollTo(0,y)}
}

      ${(ex.phases||[]).length?`<button class="bfplay" data-play>${ico("playf")}Guarda <span>· ${ex.phases.length} ${ex.phases.length===1?"fase":"fasi"}</span></button>`:""}
      ${(ex.board.lines||[]).length?arrowsBtn():""}</div>

    <div class="dactions"><button class="btn ghost" data-dup>${ico("copy")}Duplica</button><button class="btn ghost" data-del style="color:var(--danger)">${ico("trash")}Elimina</button></div>
  </div>`;
}
function bindDetail(scr,ex){
  scr.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b||b.closest(".apl")) return;
    if(b.hasAttribute("data-back")) return goBack();
    if(b.hasAttribute("data-play")) return animPlayer(b.closest(".boardframe"),ex.board,ex.phases,{restatic:on=>boardSVG(ex.board,{arrows:on,label:"Lavagna di "+(ex.name||"esercizio")})});
    if(b.hasAttribute("data-arrows")) return toggleArrows(b,ex.board,{label:"Lavagna di "+(ex.name||"esercizio")});
    if(b.hasAttribute("data-edit")) return editExercise(ex.id);
    if(b.hasAttribute("data-markdone")) return openMarkDone(ex);
    if(b.dataset.goday) return gotoDay(b.dataset.goday);
    if(b.hasAttribute("data-board")){
      const mine=()=>{const dr=Drafts.get();return dr&&dr.kind==="board"&&dr.d.id===ex.id};
      return openBoardEditor(ex.board,nb=>{
        const n={...clone(ex),board:nb,area:syncAreaText(ex.area,ex.board,nb),updatedAt:Date.now()}; if(!n.players||n.players.auto!==false) n.players=autoPlayers(nb);
        Store.put(n); if(mine()) Drafts.clear(); toast("Lavagna aggiornata");
      },nb=>Drafts.save({...clone(ex),board:nb},"board"),()=>{ if(mine()) Drafts.clear() });
    }
    if(b.hasAttribute("data-dup")){
      if(!lock("dup")) return;
      const n={...clone(ex),id:uid("ex"),name:(ex.name||"Esercizio").slice(0,72)+" (copia)",example:false,createdAt:Date.now(),updatedAt:Date.now()};
      Store.put(n); toast("Copia creata"); return go("detail",n.id);
    }
    if(b.hasAttribute("data-del")){
      if(!lock("del")) return;
      const copy=clone(ex); Store.del(ex.id); go("list",null,"back");
      toast(`«${(ex.name||"Esercizio").slice(0,40)}» eliminato`,"trash",{label:"Annulla",run:()=>{Store.put(copy);toast("Esercizio ripristinato")}});
    }
  });
}

/* ================= NUOVO / MODIFICA ================= */
function newExercise(){
  if(!lock("new")) return;
  S.draft={id:uid("ex"),name:"",focuses:[],focus:null,tags:[],players:autoPlayers(emptyBoard()),duration:10,area:"",description:"",keyPoints:"",variations:"",board:emptyBoard(),phases:[],_new:true};
  S.dirty=false; go("edit",S.draft.id);
}
function editExercise(id){const ex=Store.byId(id); if(!ex) return; S.draft={...clone(ex),phases:clone(ex.phases||[]),focuses:ex.focuses||[],tags:ex.tags||[],players:ex.players||{att:pAtt(ex),def:pDef(ex),auto:true}}; S.dirty=false; go("edit",id)}
function normDraft(d){ if(!Array.isArray(d.focuses)) d.focuses=d.focus?[d.focus]:[]; if(!Array.isArray(d.tags)) d.tags=[]; d.board=d.board?cleanBoard(d.board):emptyBoard(); if(!Array.isArray(d.phases)) d.phases=[]; return d }
const fcntText=d=>{const n=(d.focuses||[]).length;return n?`${n} ${n===1?"selezionato":"selezionati"} · uno o più`:"uno o più"};
function resumeDraft(){const dr=Drafts.get(); if(!dr) return; S.draft=normDraft(dr.d); S.dirty=true; go("edit",dr.d.id); toast("Bozza ripristinata")}
function chipsFor(g,isSel){
  const attr=g.id==="focus"?"data-focus":"data-tag";
  return g.tags.map(t=>`<button type="button" class="chip" ${attr}="${esc(t.id)}" aria-pressed="${isSel(t.id)}">${esc(t.l)}</button>`).join("")+
    (Store.taxKnown?`<button type="button" class="chip add" data-addtag="${esc(g.id)}">${ico("plus")}Nuovo</button>`:"");
}
/* svolgimento animato: parte extra, parte sempre dalla disposizione */
function animFieldHTML(d){
  const n=(d.phases||[]).length, can=d.board.items.some(i=>isPlayerT(i.t)||i.t==="ball");
  return `<div class="field animfield"><div class="lbl">Svolgimento animato <em>facoltativo</em></div>
    ${n?`<div class="boardframe bfwrap animprev"><div class="bfopen">${boardSVG(d.board,{under:arrowsOn()?allPathsSVG(d.board,d.phases):""})}</div><button type="button" class="bfplay" data-play>${ico("playf")}Guarda <span>· ${n} ${n===1?"fase":"fasi"}</span></button></div>`:""}
    <button type="button" class="btn ghost block" data-anim${can?"":" disabled"}>${ico(n?"edit":"plus")}${n?"Modifica le fasi":"Crea animazione"}</button>
    <span class="auto-note">${n?`<b class="mono">${n}</b> ${n===1?"fase":"fasi"} · <b class="mono">${fmtSec(animSecs(d.phases))} s</b>. Parte sempre dalla disposizione qui sopra: se la cambi, le fasi restano.`
      :can?"Dividi lo svolgimento in fasi. In ogni fase trascini i giocatori dove arrivano (in linea retta) e passi la palla trascinandola su un compagno: frecce e animazione si fanno da sole."
      :"Prima metti i giocatori sulla lavagna: l'animazione parte da lì."}</span></div>`;
}
function editHTML(d){
  const c=boardCounts(d.board), pl=d.players, fg=TAX.groups.find(g=>g.id==="focus");
  return `<header class="topbar"><button class="iconbtn" data-cancel aria-label="Annulla">${ico("close")}</button>${BRAND_SM}<div class="title-sm" style="flex:1">${d._new?"Nuovo esercizio":"Modifica esercizio"}</div></header>
  <form class="form" id="exform" novalidate>
    <div class="field"><label for="f-name">Nome</label><input class="input big" id="f-name" value="${esc(d.name)}" placeholder="es. 2 contro 1 nel corridoio" maxlength="80" autocomplete="off"><span class="err" id="name-err" hidden>Dai un nome all'esercizio per salvarlo.</span></div>
    <div class="field"><div class="lbl">Lavagna <em>disposizione iniziale</em></div>
      <button type="button" class="boardpick" data-board aria-label="Apri la lavagna">${boardSVG(d.board)}<span class="cta">${ico("board")}${d.board.items.length||(d.board.areas||[]).length?"Modifica lavagna":"Disegna disposizione"}</span></button>
      <div class="boardsum"><span><b>${c.att}</b> att.</span>${c.sh?`<span><b>${c.sh}</b> mediano</span>`:""}<span><b>${c.def}</b> dif.</span><span><b>${c.cone}</b> coni</span><span><b>${c.ball}</b> palloni</span><span><b>${c.shield}</b> scudi</span></div></div>
    ${animFieldHTML(d)}
    <div class="field"><div class="lbl">${esc(fg.l)} <em id="fcnt">${fcntText(d)}</em></div><div class="chipwrap">${chipsFor(fg,id=>d.focuses.includes(id))}</div></div>
    ${TAG_GROUPS.map(g=>`<div class="field"><div class="lbl">${esc(g.l)} <em>uno o più</em></div><div class="chipwrap">${chipsFor(g,id=>d.tags.includes(id))}</div></div>`).join("")}
    <div class="field"><div class="lbl">Giocatori coinvolti <em>${pl.auto?"presi dalla lavagna":`impostati a mano · <button type="button" class="linkbtn" data-recalc>Ricalcola</button>`}</em></div>
      <div class="row2"><div class="group"><span class="gname">Attacco${c.sh?" (9 incluso)":""}</span>${stepperHTML("p-att",pl.att,"Attaccanti")}</div><div class="group"><span class="gname">Difesa</span>${stepperHTML("p-def",pl.def,"Difensori")}</div></div>
      <span class="auto-note">Totale <b class="mono">${pl.att+pl.def}</b>. Usato dal filtro per numero di giocatori.</span></div>
    <div class="row2">
      <div class="field"><div class="lbl">Durata <em>min</em></div>${stepperHTML("f-dur",d.duration,"Durata in minuti")}</div>
      <div class="field"><label for="f-area">Spazio</label><input class="input" id="f-area" value="${esc(d.area)}" placeholder="22 × 15 m" maxlength="40"></div>
    </div>
    <div class="field"><label for="f-desc">Svolgimento</label><textarea class="textarea" id="f-desc" placeholder="Come si organizza e come si svolge, regole, punteggio">${esc(d.description)}</textarea></div>
    <div class="field"><label for="f-kp">Punti chiave <em>uno per riga</em></label><textarea class="textarea" id="f-kp" placeholder="Spalla bassa sul contatto&#10;Testa dalla parte giusta">${esc(d.keyPoints)}</textarea></div>
    <div class="field"><label for="f-var">Varianti e progressioni</label><textarea class="textarea" id="f-var" placeholder="Aggiungi un difensore, riduci lo spazio…">${esc(d.variations)}</textarea></div>
    <p class="auto-note draftnote">${ico("check")}La bozza si salva da sola sul telefono mentre scrivi.</p>
  </form>
  <div class="savebar"><button class="btn primary block" data-save>${ico("check")}Salva esercizio</button></div>`;
}
function bindEdit(scr){
  const d=S.draft, mark=()=>{S.dirty=true;Drafts.save(d)};
  const map={"f-name":"name","f-area":"area","f-desc":"description","f-kp":"keyPoints","f-var":"variations"};
  Object.entries(map).forEach(([id,k])=>$("#"+id,scr).addEventListener("input",e=>{d[k]=e.target.value;mark();if(k==="name")$("#name-err").hidden=true}));
  $("#exform",scr).addEventListener("submit",e=>e.preventDefault());
  scr.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b||b.closest(".apl")) return;
    if(b.dataset.focus){const f=b.dataset.focus;d.focuses=d.focuses.includes(f)?d.focuses.filter(x=>x!==f):[...d.focuses,f];d.focus=d.focuses[0]||null;mark();
      b.setAttribute("aria-pressed",String(d.focuses.includes(f)));const fc=$("#fcnt");if(fc)fc.textContent=fcntText(d);return}
    if(b.dataset.tag){const t=b.dataset.tag;d.tags=d.tags.includes(t)?d.tags.filter(x=>x!==t):[...d.tags,t];b.setAttribute("aria-pressed",String(d.tags.includes(t)));mark();return}
    if(b.dataset.addtag){
      const gid=b.dataset.addtag, inp=document.createElement("input");
      inp.className="chip-input"; inp.maxLength=40; inp.placeholder=gid==="focus"?"Nuovo focus":"Nuovo tag"; inp.setAttribute("enterkeyhint","done"); inp.setAttribute("aria-label",inp.placeholder);
      b.replaceWith(inp); inp.focus();
      let done=false;
      const commit=()=>{ if(done) return; done=true; const r=addTagTo(gid,inp.value);
        if(r){ if(gid==="focus"){ if(!d.focuses.includes(r.id)) d.focuses=[...d.focuses,r.id]; d.focus=d.focuses[0] } else if(!d.tags.includes(r.id)) d.tags=[...d.tags,r.id]; mark(); toast(r.existed?"Già presente: selezionato":"Aggiunto e selezionato") }
        rerender() };
      inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ev.preventDefault();commit()} else if(ev.key==="Escape"){ev.preventDefault();done=true;rerender()} });
      inp.addEventListener("blur",()=>{ if(!done) commit() });
      return;
    }
    if(b.dataset.step){const k=b.dataset.step,dl=+b.dataset.d;
      if(k==="f-dur"){d.duration=Math.max(0,Math.min(180,(+d.duration||0)+dl*5))}
      else{const f=k==="p-att"?"att":"def";d.players={...d.players,[f]:Math.max(0,Math.min(60,d.players[f]+dl)),auto:false}}
      mark();rerender();return}
    if(b.hasAttribute("data-recalc")){d.players=autoPlayers(d.board);mark();rerender();return}
    if(b.hasAttribute("data-play")) return animPlayer(b.closest(".boardframe"),d.board,d.phases,{restatic:on=>boardSVG(d.board,{arrows:on,under:on?allPathsSVG(d.board,d.phases):""})});
    if(b.hasAttribute("data-anim")) return openAnimEditor(d.board,d.phases||[],
      phs=>{d.phases=phs;mark();rerender();if(phs.length)toast(`Animazione: ${phs.length} ${phs.length===1?"fase":"fasi"}`,"playf")},
      phs=>Drafts.save({...d,phases:phs}),
      ()=>{ if(S.dirty) Drafts.now(d); else Drafts.clear() });
    if(b.hasAttribute("data-board")) return openBoardEditor(d.board,
      nb=>{const old=d.board;d.board=nb;d.area=syncAreaText(d.area,old,nb);if(d.players.auto) d.players=autoPlayers(nb);mark();rerender()},
      nb=>Drafts.save({...d,board:nb}),
      ()=>{ if(S.dirty) Drafts.now(d); else Drafts.clear() });
    if(b.hasAttribute("data-cancel")){
      if(S.dirty&&S.armBack<Date.now()){S.armBack=Date.now()+3000;toast("Modifiche non salvate: tocca di nuovo × per scartarle","close");return}
      const id=d._new?null:d.id; Drafts.clear(); S.draft=null; S.dirty=false; return id&&Store.byId(id)?go("detail",id,"back"):go("list",null,"back");
    }
    if(b.hasAttribute("data-save")){
      if(!d.name.trim()){const er=$("#name-err");er.hidden=false;$("#f-name").focus();$("#f-name").scrollIntoView({block:"center",behavior:"smooth"});return}
      if(!lock("save")) return;
      const now=Date.now(), {_new,...ex}=clone(d); ex.name=ex.name.trim(); ex.updatedAt=now; if(_new||!ex.createdAt) ex.createdAt=now; ex.example=false;
      if(Store.taxKnown){ex.tags=(ex.tags||[]).filter(t=>TAG[t]); ex.focuses=(ex.focuses||[]).filter(f=>FOC[f])} ex.focus=(ex.focuses||[])[0]||null;
      if(!Store.put(ex)){toast("Non riesco a salvare: controlla i campi","close");return}
      Drafts.clear(); S.draft=null; S.dirty=false; toast(_new?"Esercizio creato":"Modifiche salvate"); go("detail",ex.id,"back");
    }
  });
  function rerender(){const y=window.scrollY;const scr2=renderScreen(null);window.scrollTo(0,y);return scr2}
}

/* ================= GESTIONE TAG ================= */
function usageMap(){const m={},inc=k=>{m[k]=(m[k]||0)+1};Store.items.forEach(ex=>{(ex.focuses||[]).forEach(inc);(ex.tags||[]).forEach(inc)});Store.plays.forEach(p=>{if(p.situation)inc(p.situation);(p.zones||[]).forEach(inc)});return m}
function tgroupHTML(g,use,on){
  const noun=g.id==="focus"?"focus":g.id==="sit"?"situazione":g.id==="zona"?"zona":"tag";
  const rows=g.tags.map(t=>{
    const n=use[t.id]||0;
    if(on&&S.tagEdit===t.id) return `<li><form class="trow editing" data-renform="${esc(t.id)}" data-g="${esc(g.id)}"><input class="input" id="ren-${esc(t.id)}" value="${esc(t.l)}" maxlength="40" autocomplete="off" aria-label="Nuovo nome"><button class="iconbtn sm ok" aria-label="Salva nome">${ico("check")}</button><button type="button" class="iconbtn sm" data-rencancel aria-label="Annulla">${ico("close")}</button></form></li>`;
    return `<li class="trow${S.justAdded===t.id?" new":""}"><button class="tname" data-ren="${esc(t.id)}" aria-label="Rinomina ${esc(t.l)}"${on?"":" disabled"}>${esc(t.l)}</button><span class="tuse mono${n?"":" zero"}" title="Esercizi che lo usano">${n}</span>${on?`<button class="iconbtn sm" data-ren="${esc(t.id)}" aria-label="Rinomina ${esc(t.l)}">${ico("edit")}</button><button class="iconbtn sm" data-deltag="${esc(t.id)}" data-g="${esc(g.id)}" aria-label="Elimina ${esc(t.l)}">${ico("trash")}</button>`:""}</li>`;
  }).join("");
  return `<section class="tgroup" aria-label="${esc(g.l)}">
    <header><h2>${esc(g.l)}</h2><span class="mono">${g.tags.length}</span><em>${g.id==="sit"?"una per schema":g.scope==="plays"?"una o più per schema":"uno o più per esercizio"}</em></header>
    ${g.tags.length?`<ul class="trows">${rows}</ul>`:`<p class="note" style="margin:6px 4px">Nessuna voce. Aggiungi la prima qui sotto.</p>`}
    ${on?`<form class="tadd" data-add="${esc(g.id)}"><input class="input" id="add-${esc(g.id)}" placeholder="Nuovo ${noun}" maxlength="40" autocomplete="off" enterkeyhint="done" aria-label="Nuovo ${noun} in ${esc(g.l)}"><button class="btn primary" aria-label="Aggiungi">${ico("plus")}</button></form>
    <span class="err" id="err-${esc(g.id)}" hidden></span>`:""}
  </section>`;
}
function tagsHTML(){
  const use=usageMap(), on=Store.taxKnown;
  return `<header class="topbar"><button class="iconbtn" data-back aria-label="Torna alla libreria">${ico("back")}</button>${BRAND_SM}<div class="title-sm" style="flex:1">Tag e focus</div></header>
  <div class="tagmgr">
    ${on?`<p class="lead">Aggiungi, rinomina o elimina le voci di ogni categoria. Le modifiche valgono subito per tutti gli esercizi e per i filtri. Il numero accanto a ogni voce indica in quanti esercizi è usata.</p>`
      :`<div class="banner warn"><div>${ico("sync")}<span><b>Sto caricando la tua lista di tag.</b> Le modifiche si attivano appena arriva, così non sovrascrivo niente.</span></div></div>`}
    <h3 class="tsec">Allenamento</h3>${TAX.groups.filter(g=>g.scope!=="plays").map(g=>tgroupHTML(g,use,on)).join("")}
    <h3 class="tsec">Schemi</h3>${TAX.groups.filter(g=>g.scope==="plays").map(g=>tgroupHTML(g,use,on)).join("")}
    <p class="note">${ico("users")}<span>Giocatori coinvolti e durata non sono tag: si impostano in ogni esercizio e si filtrano con i contatori nei Filtri.</span></p>
  </div>`;
}
function rerenderTags(focusSel){const y=window.scrollY;renderScreen(null);window.scrollTo(0,y);if(focusSel){const el=$(focusSel);if(el){el.focus({preventScroll:true});if(el.select)el.select()}}}
function bindTags(scr){
  scr.addEventListener("submit",e=>{
    e.preventDefault(); if(!Store.taxKnown) return;
    const f=e.target;
    if(f.dataset.add){
      const gid=f.dataset.add, inp=f.querySelector("input"), err=$("#err-"+CSS.escape(gid)), label=inp.value.trim().replace(/\s+/g," ");
      const g=TAX.groups.find(x=>x.id===gid); if(!g) return;
      if(!label){err.textContent="Scrivi un nome prima di aggiungere.";err.hidden=false;inp.focus();return}
      if(g.tags.some(x=>x.l.toLowerCase()===label.toLowerCase())){err.textContent=`«${label}» esiste già in ${g.l}.`;err.hidden=false;inp.focus();return}
      const r=addTagTo(gid,label); S.justAdded=r&&r.id; toast("Aggiunto in "+g.l);
      rerenderTags("#add-"+CSS.escape(gid)); S.justAdded=null; return;
    }
    if(f.dataset.renform){
      const id=f.dataset.renform, gid=f.dataset.g, label=f.querySelector("input").value.trim().replace(/\s+/g," ");
      const g=TAX.groups.find(x=>x.id===gid), tag=g&&g.tags.find(x=>x.id===id);
      if(!tag){S.tagEdit=null;return rerenderTags()}
      if(!label){toast("Il nome non può essere vuoto","close");return}
      if(g.tags.some(x=>x.id!==id&&x.l.toLowerCase()===label.toLowerCase())){toast(`«${label}» esiste già`,"close");return}
      S.tagEdit=null;
      if(tag.l!==label){Store.taxOp({t:"ren",g:gid,id,l:label.slice(0,40)});toast("Rinominato")}
      rerenderTags();
    }
  });
  scr.addEventListener("input",e=>{const f=e.target.closest("[data-add]");if(f){const er=$("#err-"+CSS.escape(f.dataset.add));if(er)er.hidden=true}});
  scr.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.tagEdit){S.tagEdit=null;rerenderTags()}});
  scr.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.hasAttribute("data-back")){S.tagEdit=null;return goBack()}
    if(!Store.taxKnown) return;
    if(b.dataset.ren){S.tagEdit=b.dataset.ren;return rerenderTags("#ren-"+CSS.escape(b.dataset.ren))}
    if(b.hasAttribute("data-rencancel")){S.tagEdit=null;return rerenderTags()}
    if(b.dataset.deltag) return confirmDeleteTag(b.dataset.g,b.dataset.deltag);
  });
}
function confirmDeleteTag(gid,id){
  const g=TAX.groups.find(x=>x.id===gid), tag=g&&g.tags.find(x=>x.id===id); if(!tag) return;
  const users=Store.items.filter(ex=>(ex.focuses||[]).includes(id)||(ex.tags||[]).includes(id)), pusers=Store.plays.filter(p=>p.situation===id||(p.zones||[]).includes(id)), n=users.length+pusers.length, wsg=g.scope==="plays"?["schema","schemi"]:["esercizio","esercizi"];
  openSheet({title:g.id==="focus"?"Eliminare il focus?":"Eliminare la voce?",
    body:`<p style="margin:0;color:var(--ink-2)">«${esc(tag.l)}» verrà rimosso da ${esc(g.l)}. ${n?`È assegnato a <b class="mono">${n}</b> ${n===1?wsg[0]+", che resterà":wsg[1]+", che resteranno"} in libreria senza questa voce.`:"Non è assegnato a nessun esercizio."}</p>`,
    footer:`<button class="btn ghost" data-no>Annulla</button><button class="btn danger" data-yes>${ico("trash")}Elimina</button>`,
    mount:(sh,close)=>{$("[data-no]",sh).onclick=close;$("[data-yes]",sh).onclick=()=>{
      if(!lock("tagdel")) return;
      Store.taxOp({t:"del",g:gid,id});
      if(users.length) Store.putMany(users.map(ex=>{const nx={...clone(ex),tags:(ex.tags||[]).filter(x=>x!==id),focuses:(ex.focuses||[]).filter(x=>x!==id)}; nx.focus=nx.focuses[0]||null; return nx}));
      if(pusers.length) Store.putPlays(pusers.map(p=>{const np={...clone(p),zones:(p.zones||[]).filter(x=>x!==id)}; if(np.situation===id) np.situation=null; return np}));
      S.f.tags=S.f.tags.filter(x=>x!==id); S.f.focus=S.f.focus.filter(x=>x!==id); persistUI();
      close(); toast(g.id==="focus"?"Focus eliminato":"Voce eliminata");
      if(S.view==="tags") rerenderTags();
    }}});
}

/* ================= SCHEMI (in preparazione) ================= */
function schemiHTML(){
  const demo={bg:"half",items:[{id:"1",t:"sh",x:150,y:200},{id:"2",t:"att",x:200,y:215,n:10},{id:"3",t:"att",x:250,y:228,n:12},{id:"4",t:"att",x:300,y:240,n:13},{id:"5",t:"att",x:235,y:250,n:15},
    {id:"d1",t:"def",x:215,y:150,n:10},{id:"d2",t:"def",x:265,y:158,n:12},{id:"d3",t:"def",x:315,y:166,n:13},{id:"b",t:"ball",x:150,y:186}],
    lines:[{id:"a",t:"pass",x1:150,y1:200,x2:192,y2:212},{id:"c",t:"run",x1:250,y1:228,x2:232,y2:178},{id:"e",t:"run",x1:235,y1:250,x2:285,y2:190}]};
  return `<header class="topbar">${BRAND}<h1><small>Lanci di gioco</small>Schemi</h1></header>
  <div class="soon">
    <div class="boardframe">${boardSVG(demo,{label:"Anteprima di un lancio di gioco"})}<span class="edit-hint">${ico("play")}In preparazione</span></div>
    <p>Questa sezione raccoglierà i lanci che allenate e usate in partita. È la prossima da costruire.</p>
    <ul><li>Lavagna a fasi con tasto Play che anima lo sviluppo della giocata</li><li>Situazione di partenza: touche, mischia, ripartenza, prima fase</li><li>Chiamata, ruoli e note per ogni giocatore</li></ul>
  </div>`;
}

/* ================= ROUTER ================= */
let lastDetailKey="";
const detailKey=ex=>ex?JSON.stringify(ex)+TAX.groups.map(g=>g.tags.map(t=>t.id+t.l).join()).join()+Store.logs.filter(l=>l.exId===ex.id).map(l=>l.id).join():"";
function goBack(){ if(S.retTab){ S.tab=S.retTab; S.retTab=null; S.view="list"; const y=window.scrollY; renderScreen("enter-back"); return } go("list",null,"back") }
function go(view,id=null,dir="fwd"){S.view=view;S.id=id;S.armBack=0;renderScreen(dir==="back"?"enter-back":"enter");window.scrollTo(0,0)}
function renderScreen(anim){
  const app=$("#app"); const scr=document.createElement("div"); scr.className="screen"+(anim?" "+anim:"");
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===S.tab)));
  document.querySelectorAll(".fab").forEach(f=>f.remove());
  if(S.tab==="schemi") return renderPlays(app,scr);
  if(S.tab==="calendario"){scr.innerHTML=calHTML();app.replaceChildren(scr);bindCal(scr);return scr}
  if(S.view==="detail"){const ex=Store.byId(S.id); if(!ex){if(Store.ready){S.view="list";return renderScreen(anim)} scr.innerHTML=`<div class="list" style="padding-top:16px"><div class="skel" style="height:240px"></div></div>`; app.replaceChildren(scr); return scr}
    lastDetailKey=detailKey(ex);
    scr.innerHTML=detailHTML(ex); app.replaceChildren(scr); bindDetail(scr,ex); return scr}
  if(S.view==="tags"){scr.innerHTML=tagsHTML(); app.replaceChildren(scr); bindTags(scr); return scr}
  if(S.view==="edit"&&S.draft){scr.innerHTML=editHTML(S.draft); app.replaceChildren(scr); bindEdit(scr); return scr}
  S.view="list";
  scr.innerHTML=libraryHTML(); app.replaceChildren(scr); bindLibrary(scr); updateLibrary(true);
  const fab=document.createElement("button"); fab.className="fab"; fab.innerHTML=ico("plus")+"Esercizio"; fab.setAttribute("aria-label","Nuovo esercizio"); fab.onclick=newExercise; document.body.appendChild(fab);
  return scr;
}
document.querySelector(".tabbar").addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]"); if(!t||t.dataset.tab===S.tab) return;
  if(S.view==="edit"&&S.dirty){Drafts.now(S.draft);toast("Bozza salvata: la ritrovi nella libreria","edit")}
  if(S.tab==="schemi"&&P.view==="edit"){ if(P.dirty){PDrafts.now(P.draft);toast("Bozza dello schema salvata","edit")} P.draft=null; P.view="list" }
  S.retTab=null; S.tab=t.dataset.tab; if(S.view==="edit"||S.view==="tags"){S.draft=null;S.tagEdit=null;S.view="list"} renderScreen("enter"); window.scrollTo(0,0);
});
const flushDraft=()=>{ if(S.view==="edit"&&S.draft&&S.dirty) Drafts.now(S.draft); if(S.tab==="schemi"&&P.view==="edit"&&P.draft&&P.dirty) PDrafts.now(P.draft) };
addEventListener("pagehide",flushDraft);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushDraft() });
addEventListener("qtr:sheetclosed",()=>{
  if($(".sheet")||$(".editor")) return;
  if(S.tab==="calendario") rerenderCal();
  else if(S.tab==="schemi") playsOnData();
  else if(S.tab==="allenamento"&&S.view==="detail"&&detailKey(Store.byId(S.id))!==lastDetailKey){const y=window.scrollY;renderScreen(null);window.scrollTo(0,y)}
  else if(S.tab==="allenamento"&&S.view==="list") updateLibrary(false);
});
let hadData=false;
Store.sub(kind=>{
  renderStatus(); refreshDataSheet();
  if(kind!=="data") return;
  const first=!hadData&&Store.ready; if(Store.ready) hadData=true;
  if(S.tab==="calendario"){ if(!$(".sheet")&&!$(".editor")) rerenderCal(); return }
  if(S.tab==="schemi"){ playsOnData(); return }
  if(S.tab!=="allenamento") return;
  if(S.view==="list"){ updateLibrary(first); return }
  if($(".sheet")||$(".editor")) return;
  if(S.view==="detail"){const ex=Store.byId(S.id); const k=detailKey(ex); if(k!==lastDetailKey){const y=window.scrollY;renderScreen(null);window.scrollTo(0,y)}}
  else if(S.view==="tags"){const a=document.activeElement; if(!S.tagEdit&&!(a&&a.matches&&a.matches(".tagmgr input"))) rerenderTags()}
});
Cloud.boot(function start(){
  Store.init();
  const dr=Drafts.get();
  const pd=PDrafts.get();
  if(dr&&Date.now()-dr.at<2*3600e3){ S.draft=normDraft(dr.d); S.dirty=true; S.view="edit"; S.id=dr.d.id; renderScreen(null); toast("Bozza ripristinata","edit") }
  else if(pd&&Date.now()-pd.at<2*3600e3){ S.tab="schemi"; P.draft=normPlayDraft(pd.d); P.dirty=true; P.view="edit"; P.id=pd.d.id; renderScreen(null); toast("Bozza dello schema ripristinata","edit") }
  else renderScreen(null);
});
</script>
