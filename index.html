      if(a){ a.w=w; a.h=h; placeArea(a,a.x,a.y); syncCones(a); sel=a.id; shut(); repaint(); ensureVisible(areaRect(a)); return }
      const cones=$("#acones",dlg).checked; lsSet("qtr.areaCones",cones);
      const na={id:uid("a"),x:v.x,y:v.y,w,h}; placeArea(na,v.x,v.y); b.areas.push(na); if(cones) addCones(na);
      sel=na.id; tool="move"; shut(); paintUI(); paintBoard(); if(onChange) onChange({...b,view:roundView(v)});
      animateTo(fitRect(areaRect(na),.2));
    };
    dlg.addEventListener("click",e=>{
      if(e.target===dlg) return shut();
      const t=e.target.closest("button"); if(!t) return;
      if(t.dataset.ap){const [w,h]=t.dataset.ap.split("x");aw.value=w;ah.value=h;err.hidden=true;return}
      if(t.dataset.ad==="cancel") return shut();
      if(t.dataset.ad==="ok") return ok();
    });
    dlg.addEventListener("input",()=>{err.hidden=true});
    aw.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ah.focus();ah.select()}});
    ah.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ok()}});
    [aw,ah].forEach(i=>i.addEventListener("focus",()=>i.select()));
    dlg.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();shut()}});
  }

  /* --- Allinea: la pedina va sulla riga o sulla colonna della pedina più vicina;
         l'altra coordinata si aggancia a righe/colonne di altre pedine e ai bordi delle aree quando è vicina --- */
  function snapPt(p,exclude){
    if(!snap) return {x:p.x,y:p.y,g:[]};
    const refs=b.items.filter(i=>i.id!==exclude), T=12/pxPerUnit();
    const ax=[], ay=[]; b.areas.forEach(a=>{const r=areaRect(a);ax.push(r.x0,a.x,r.x1);ay.push(r.y0,a.y,r.y1)});
    const near=(vals,val)=>{let best=null,bd=T;vals.forEach(c=>{const d=Math.abs(c-val);if(d<=bd){bd=d;best=c}});return best};
    let x=p.x, y=p.y; const g=[];
    if(refs.length){
      let q=refs[0], qd=Infinity; refs.forEach(i=>{const d=Math.hypot(i.x-p.x,i.y-p.y);if(d<qd){qd=d;q=i}});
      if(Math.abs(p.x-q.x)<=Math.abs(p.y-q.y)){ x=q.x; g.push({k:"v",at:q.x});
        const c=near([...refs.map(i=>i.y),...ay].filter(c=>Math.abs(c-q.y)>.5),p.y); if(c!=null){y=c;g.push({k:"h",at:c})} }
      else { y=q.y; g.push({k:"h",at:q.y});
        const c=near([...refs.map(i=>i.x),...ax].filter(c=>Math.abs(c-q.x)>.5),p.x); if(c!=null){x=c;g.push({k:"v",at:c})} }
    }else{ const cx=near(ax,p.x), cy=near(ay,p.y); if(cx!=null){x=cx;g.push({k:"v",at:cx})} if(cy!=null){y=cy;g.push({k:"h",at:cy})} }
    return {x:Math.max(4,Math.min(BW-4,x)),y:Math.max(4,Math.min(BH-4,y)),g};
  }

  /* --- ricerca dell'elemento più vicino al dito --- */
  function segDist(p,l){const dx=l.x2-l.x1,dy=l.y2-l.y1,L=dx*dx+dy*dy||1;let t=((p.x-l.x1)*dx+(p.y-l.y1)*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(l.x1+t*dx),p.y-(l.y1+t*dy))}
  function hitTest(p,rpx){
    const R=rpx/pxPerUnit(); let best=null;
    for(const it of b.items){const d=Math.hypot(p.x-it.x,p.y-it.y); if(d<=R&&(!best||d<best.d)) best={kind:"item",it,d}}
    if(best) return best;
    for(const l of b.lines){
      const d1=Math.hypot(p.x-l.x1,p.y-l.y1), d2=Math.hypot(p.x-l.x2,p.y-l.y2), ds=segDist(p,l);
      const d=Math.min(d1,d2,ds); if(d<=R*.8&&(!best||d<best.d)) best={kind:"line",l,d,end:d2<=R*.8&&d2<=d1?2:d1<=R*.8?1:0};
    }
    return best;
  }
  function startDrag(h,p){
    if(h.kind==="item"){ sel=h.it.id; drag={kind:"item",it:h.it,ox:p.x-h.it.x,oy:p.y-h.it.y,moved:false,sx:p.x,sy:p.y} }
    else { sel=h.l.id; drag={kind:"line",l:h.l,end:h.end,orig:{...h.l},sx:p.x,sy:p.y,moved:false} }
    paintBoard(); paintUI();
  }

  /* --- gesti --- */
  const dist=()=>{const [a,c]=[...pts.values()];return Math.hypot(a.x-c.x,a.y-c.y)};
  const mid=()=>{const [a,c]=[...pts.values()];return {x:(a.x+c.x)/2,y:(a.y+c.y)/2}};
  function startPinch(){
    stopTween();
    if(draft){draft=null;const g=svg().querySelector(".preview");if(g)g.innerHTML=""}
    if(drag){drag=null;guides=[];repaint()}
    pan=null; const m=mid(); pinch={d0:dist()||1,z0:v.z,P:toPt(m.x,m.y,false)};
  }
  function movePinch(){
    const m=mid(), r=svg().getBoundingClientRect(), z=Math.max(1,Math.min(ZMAX,pinch.z0*dist()/pinch.d0)), w=BW/z, h=BH/z;
    v=clampView({x:pinch.P.x-(m.x-r.left)/r.width*w+w/2,y:pinch.P.y-(m.y-r.top)/r.height*h+h/2,z}); schedule();
  }
  const itemNode=it=>svg().querySelector(`[data-item="${CSS.escape(it.id)}"]`);
  wrap.addEventListener("pointerdown",e=>{
    if(e.button>0) return;
    stopTween(); flush();
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); try{wrap.setPointerCapture(e.pointerId)}catch{}
    if(pts.size===2){ startPinch(); return }
    if(pts.size>2||block) return;
    const p=toPt(e.clientX,e.clientY), place=!!ITEM_TYPES[tool], lineTool=tool==="run"||tool==="pass";
    if(lineTool){ draft={x1:p.x,y1:p.y,x2:p.x,y2:p.y,t:tool}; return }
    const h=hitTest(p,place?15:28);
    if(h){ startDrag(h,p); return }
    if(place){
      push(); const q=snapPt(p,null), it={id:uid("i"),t:tool,x:+q.x.toFixed(1),y:+q.y.toFixed(1)};
      if(tool==="att"||tool==="def") it.n=nextN(tool);
      b.items.push(it); fresh=it.id; sel=null; guides=q.g;
      drag={kind:"item",it,ox:0,oy:0,moved:true,placed:true,sx:p.x,sy:p.y}; // si può subito trascinare per sistemarla
      paintBoard(); paintUI(); return;
    }
    const sa=sel&&b.areas.find(a=>a.id===sel);
    if(sa&&inArea(sa,p)){ drag={kind:"area",a:sa,ox:p.x-sa.x,oy:p.y-sa.y,moved:false,sx:p.x,sy:p.y}; return }
    pan={sx:e.clientX,sy:e.clientY,v0:{...v},moved:false,area:areaAt(p)};
  });
  wrap.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch){ if(pts.size>=2) movePinch(); return }
    if(block) return;
    if(pan){ const dx=e.clientX-pan.sx, dy=e.clientY-pan.sy; if(Math.hypot(dx,dy)>5) pan.moved=true;
      if(v.z>1&&pan.moved){ const k=(BW/v.z)/svg().getBoundingClientRect().width; v=clampView({x:pan.v0.x-dx*k,y:pan.v0.y-dy*k,z:v.z}); schedule() } return }
    if(draft){const p=toPt(e.clientX,e.clientY);draft.x2=p.x;draft.y2=p.y;const g=svg().querySelector(".preview");if(g)g.innerHTML=lineSVG({...draft,id:"draft"},{s:1/v.z});return}
    if(!drag) return;
    const p=toPt(e.clientX,e.clientY);
    if(!drag.moved){ if(Math.hypot(p.x-drag.sx,p.y-drag.sy)*pxPerUnit()<4) return; push(); drag.moved=true;
      if(drag.kind==="item"&&drag.it.ar){ delete drag.it.ar; delete drag.it.ck } }
    if(drag.kind==="item"){
      const q=snapPt({x:p.x-drag.ox,y:p.y-drag.oy},drag.it.id);
      drag.it.x=+q.x.toFixed(1); drag.it.y=+q.y.toFixed(1); guides=q.g;
      const node=itemNode(drag.it); if(node) node.setAttribute("transform",`translate(${drag.it.x} ${drag.it.y}) scale(${(1/v.z).toFixed(4)})`);
      paintGuides();
    }else if(drag.kind==="area"){
      placeArea(drag.a,p.x-drag.ox,p.y-drag.oy); syncCones(drag.a); schedule();
    }else{
      const dx=p.x-drag.sx, dy=p.y-drag.sy, l=drag.l, o=drag.orig;
      if(drag.end===2){l.x2=+p.x.toFixed(1);l.y2=+p.y.toFixed(1)}
      else if(drag.end===1){l.x1=+p.x.toFixed(1);l.y1=+p.y.toFixed(1)}
      else{l.x1=+(o.x1+dx).toFixed(1);l.y1=+(o.y1+dy).toFixed(1);l.x2=+(o.x2+dx).toFixed(1);l.y2=+(o.y2+dy).toFixed(1)}
      svg().querySelector(".lines").innerHTML=b.lines.map(x=>lineSVG(x,{edit:true,sel:x.id===sel,s:1/v.z})).join("");
    }
  });
  const end=e=>{
    pts.delete(e.pointerId);
    if(pinch){ if(pts.size<2){ pinch=null; block=pts.size>0 } return }
    if(block){ if(!pts.size) block=false; return }
    if(pan){ if(!pan.moved){ const na=pan.area?pan.area.id:null; if(na!==sel){ sel=na; paintBoard(); paintUI() } } pan=null; return }
    if(draft){
      const d=draft; draft=null;
      if(Math.hypot(d.x2-d.x1,d.y2-d.y1)*pxPerUnit()>14){push();b.lines.push({id:uid("l"),t:d.t,x1:+d.x1.toFixed(1),y1:+d.y1.toFixed(1),x2:+d.x2.toFixed(1),y2:+d.y2.toFixed(1)})}
      repaint(); return;
    }
    if(drag){ const moved=drag.moved; drag=null; guides=[]; if(moved) repaint(); else { paintBoard(); paintUI() } }
  };
  wrap.addEventListener("pointerup",end); wrap.addEventListener("pointercancel",end);
  wrap.addEventListener("wheel",e=>{
    e.preventDefault(); stopTween();
    if(e.ctrlKey){ const p=toPt(e.clientX,e.clientY,false); zoomAt(v.z*Math.exp(-e.deltaY*0.01),p.x,p.y) }
    else if(v.z>1){ const k=(BW/v.z)/svg().getBoundingClientRect().width; v=clampView({x:v.x+e.deltaX*k,y:v.y+e.deltaY*k,z:v.z}); schedule() }
  },{passive:false});

  /* --- comandi --- */
  function finalView(){
    const r=contentRect(b,15/v.z); if(!r) return roundView(v);
    const vr=viewRect(v), inside=r.x0>=vr.x0-1&&r.y0>=vr.y0-1&&r.x1<=vr.x1+1&&r.y1<=vr.y1+1;
    return roundView(inside?v:fitRect(unionRect(vr,r),.02)); // se qualcosa resta fuori, allarga l'inquadratura
  }
  function close(save){
    stopTween(); document.removeEventListener("keydown",onKey);
    if(save) b.view=finalView();
    el.style.animation="down .2s ease forwards"; setTimeout(()=>{el.remove();if(!$(".sheet"))document.body.style.overflow="";if(save) onDone(b); else if(onCancel) onCancel()},190);
  }
  function delSel(){
    if(!sel) return; push();
    if(b.areas.some(a=>a.id===sel)){ b.items=b.items.filter(i=>i.ar!==sel); b.areas=b.areas.filter(a=>a.id!==sel) }
    b.items=b.items.filter(i=>i.id!==sel); b.lines=b.lines.filter(l=>l.id!==sel); sel=null; repaint();
  }
  el.addEventListener("click",e=>{
    const t=e.target.closest("button"); if(!t||t.closest(".edlg")) return;
    if(t.dataset.tool){ if(t.dataset.tool==="area"){ openAreaDlg(null); return } tool=t.dataset.tool; sel=null; paintBoard(); paintUI(); return }
    if(t.dataset.z!==undefined){ const d=t.dataset.z;
      if(d==="fit") animateTo(fitContent(b));
      else if(d==="0") animateTo({...DEF_VIEW});
      else { const nz=+d>0?(ZSTEPS.find(s=>s>v.z+0.01)||ZMAX):([...ZSTEPS].reverse().find(s=>s<v.z-0.01)||1); zoomAt(nz,v.x,v.y,true) }
      return }
    const a=t.dataset.a, sa=sel&&b.areas.find(x=>x.id===sel);
    if(a==="done") close(true);
    else if(a==="close"){ if(!touched||armClose>Date.now()) close(false); else {armClose=Date.now()+3000; toast("Modifiche non salvate: tocca di nuovo × per uscire","close")} }
    else if(a==="snap"){ snap=!snap; lsSet("qtr.snap",snap); paintUI(); toast(snap?"Allinea attivo: ogni pedina va sulla riga o colonna della più vicina":"Allinea spento: posizionamento libero",snap?"check":"close") }
    else if(a==="undo") undo();
    else if(a==="redo") redo();
    else if(a==="del") delSel();
    else if(a==="desel"){ sel=null; paintBoard(); paintUI() }
    else if(a==="adims"&&sa) openAreaDlg(sa);
    else if(a==="arot"&&sa){ push(); [sa.w,sa.h]=[sa.h,sa.w]; placeArea(sa,sa.x,sa.y); syncCones(sa); repaint(); ensureVisible(areaRect(sa)) }
    else if(a==="acones"&&sa){ push(); if(b.items.some(i=>i.ar===sa.id)) b.items=b.items.filter(i=>i.ar!==sa.id); else addCones(sa); repaint() }
    else if(a==="n+"||a==="n-"){ const it=b.items.find(i=>i.id===sel); if(!it) return; push(); it.n=Math.max(1,Math.min(99,(+it.n||0)+(a==="n+"?1:-1))); repaint() }
    else if(a==="dup"){
      if(sa){ push(); const c={...sa,id:uid("a")}, dx=sa.w*KM, dy=sa.h*KM;
        if(sa.x+dx+dx/2<=BW) c.x=sa.x+dx; else if(sa.x-dx-dx/2>=0) c.x=sa.x-dx; else if(sa.y+dy+dy/2<=BH) c.y=sa.y+dy; else c.y=sa.y-dy;
        placeArea(c,c.x,c.y); b.areas.push(c); if(b.items.some(i=>i.ar===sa.id)) addCones(c); sel=c.id; repaint(); ensureVisible(unionRect(areaRect(sa),areaRect(c))); return }
      const it=b.items.find(i=>i.id===sel); if(!it) return; push(); const s=1/v.z; const c={...it,id:uid("i"),x:+Math.min(BW-4,it.x+20*s).toFixed(1),y:+Math.min(BH-4,it.y+14*s).toFixed(1)}; delete c.ar; delete c.ck; if(c.n!=null) c.n=nextN(c.t); b.items.push(c); sel=c.id; fresh=c.id; repaint() }
    else if(a==="mirror"){ push(); const mx=x=>+(BW-x).toFixed(1);
      b.items.forEach(i=>{i.x=mx(i.x)}); b.lines.forEach(l=>{l.x1=mx(l.x1);l.x2=mx(l.x2)}); b.areas.forEach(ar=>{ar.x=mx(ar.x);syncCones(ar)}); v=clampView({...v,x:BW-v.x});
      let sw=false; if(opts.backs) b.items.forEach(i=>{ if((i.t==="att"||i.t==="def")&&(i.n===11||i.n===14)){ i.n=25-i.n; sw=true } });
      repaint(); toast(sw?"Specchiata: le ali 11 e 14 si scambiano":"Disposizione specchiata") }
    else if(a==="clear"){ if(armClear>Date.now()){push();b.items=[];b.lines=[];b.areas=[];armClear=0;sel=null;repaint()} else {armClear=Date.now()+3000;paintUI();setTimeout(()=>{if(el.isConnected)paintUI()},3100)} }
  });
  function onKey(e){
    if(e.target.matches("input,textarea")||$(".edlg",el)) return;
    const k=e.key.toLowerCase();
    if((e.key==="Delete"||e.key==="Backspace")&&sel){e.preventDefault();delSel()}
    else if((e.metaKey||e.ctrlKey)&&k==="z"){e.preventDefault();e.shiftKey?redo():undo()}
    else if((e.metaKey||e.ctrlKey)&&k==="y"){e.preventDefault();redo()}
    else if(e.key==="Escape"){ if(sel){sel=null;paintBoard();paintUI()} else $('[data-a="close"]',el).click() }
  }
  document.addEventListener("keydown",onKey);
}
</script>
<script>
"use strict";
/* ================= ANIMAZIONE A FASI =================
   Si parte sempre dalla disposizione della lavagna. Una fase dice dove arrivano i pezzi alla fine
   di quella fase (pos) e a chi va la palla (hold). I pezzi non toccati restano fermi.
   Ogni pezzo va in linea retta dal punto di inizio fase al punto di fine fase, tutti insieme.
   La palla vicina a un giocatore all'inizio è sua e lo segue; trascinata su un compagno = passaggio. */
const HOLD_R=12.5;                       // ~2,2 m
const PH_DUR=1500, PH_MIN=500, PH_MAX=6000;
const isPlayerT=t=>t==="att"||t==="sh"||t==="def";
const easeIO=t=>.5-Math.cos(Math.PI*Math.max(0,Math.min(1,t)))/2;
const newAnimStep=()=>({id:uid("ph"),title:"",text:"",pos:{},hold:{},ball:null,lines:[],dur:PH_DUR});
const stepEmpty=p=>!Object.keys(p.pos||{}).length&&!Object.keys(p.hold||{}).length&&!(p.title||"").trim();
const animSecs=phs=>(phs||[]).reduce((s,p)=>s+Math.max(PH_MIN,Math.min(PH_MAX,+p.dur||PH_DUR)),0)/1000;
const fmtSec=v=>String(+(+v).toFixed(1)).replace(".",",");
function animPlan(board,phases){
  const items=board.items||[], s=1/clampView(board.view).z;
  const players=items.filter(i=>isPlayerT(i.t)), balls=items.filter(i=>i.t==="ball"), byId=Object.fromEntries(items.map(i=>[i.id,i]));
  const st0={pos:{},hold:{},off:{}};
  items.forEach(i=>{st0.pos[i.id]={x:+i.x,y:+i.y}});
  balls.forEach(bl=>{let best=null,bd=HOLD_R;players.forEach(p=>{const d=Math.hypot(p.x-bl.x,p.y-bl.y);if(d<bd){bd=d;best=p}});
    if(best){st0.hold[bl.id]=best.id;st0.off[bl.id]={x:bl.x-best.x,y:bl.y-best.y}}});
  const states=[st0];
  (phases||[]).forEach(ph=>{
    const A=states[states.length-1], B={pos:{...A.pos},hold:{...A.hold},off:{...A.off}}, P=ph.pos||{}, H=ph.hold||{};
    for(const id in P){ const it=byId[id]; if(it&&it.t!=="ball") B.pos[id]={x:+P[id].x,y:+P[id].y} }
    balls.forEach(bl=>{ const id=bl.id;
      if(Object.prototype.hasOwnProperty.call(H,id)){ const h=H[id];
        if(h&&byId[h]&&isPlayerT(byId[h].t)){ if(B.hold[id]!==h){B.hold[id]=h;B.off[id]={x:10*s,y:-8*s}} }
        else { B.hold[id]=null; if(P[id]) B.pos[id]={x:+P[id].x,y:+P[id].y} } }
      else if(P[id]){ B.hold[id]=null; B.pos[id]={x:+P[id].x,y:+P[id].y} }
      const h=B.hold[id]; if(h&&B.pos[h]) B.pos[id]={x:B.pos[h].x+B.off[id].x,y:B.pos[h].y+B.off[id].y};
    });
    states.push(B);
  });
  return {states,durs:(phases||[]).map(p=>Math.max(PH_MIN,Math.min(PH_MAX,+p.dur||PH_DUR))),items,byId};
}
/* posizioni durante la fase k (1..n), t da 0 a 1 */
function framePos(plan,k,t){
  const A=plan.states[k-1], B=plan.states[k], e=easeIO(t), out={};
  for(const id in B.pos){ const a=A.pos[id]||B.pos[id], b=B.pos[id]; out[id]={x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e} }
  for(const id in B.hold){ const h=B.hold[id]; if(h&&A.hold[id]===h&&out[h]) out[id]={x:out[h].x+B.off[id].x,y:out[h].y+B.off[id].y} }
  return out;
}
/* frecce della fase k (corse bianche, passaggi gialli tratteggiati) e, nell'editor, le pedine "fantasma" di partenza */
function stepPathsSVG(plan,k,s,o={}){
  const A=plan.states[k-1], B=plan.states[k]; let g="", gh="";
  for(const it of plan.items){
    const a=A.pos[it.id], b=B.pos[it.id]; if(!a||!b) continue;
    const carried=it.t==="ball"&&B.hold[it.id]&&A.hold[it.id]===B.hold[it.id];
    const d=Math.hypot(b.x-a.x,b.y-a.y); if(d<.6||carried) continue;
    const r=(it.t==="ball"?9:13)*s, ux=(b.x-a.x)/d, uy=(b.y-a.y)/d;
    if(d>r*1.6) g+=lineSVG({id:"p-"+it.id,t:it.t==="ball"?"pass":"run",x1:a.x+ux*r*.7,y1:a.y+uy*r*.7,x2:b.x-ux*r,y2:b.y-uy*r},{s});
    if(o.ghosts) gh+=itemSVG({...it,id:"g_"+it.id,x:a.x,y:a.y},{s});
  }
  return `<g class="aghost" opacity=".36">${gh}</g><g class="apath"${o.faint?' opacity=".6"':""}>${g}</g>`;
}
function allPathsSVG(board,phases){
  board=board&&board.bg==="pitch"?board:cleanBoard(board); if(!(phases||[]).length) return "";
  const plan=animPlan(board,phases), s=1/clampView(board.view).z; let o="";
  for(let k=1;k<plan.states.length;k++) o+=stepPathsSVG(plan,k,s,{faint:true});
  return o;
}
/* interruttore Frecce su un riquadro: ridisegna solo la lavagna */
function toggleArrows(btn,board,o={}){
  const on=!arrowsOn(); lsSet("qtr.arrows",on);
  const fr=btn.closest(".boardframe"), svgEl=fr&&fr.querySelector(".bfopen svg"); if(svgEl) svgEl.outerHTML=boardSVG(board,{...o,arrows:on});
  btn.outerHTML=arrowsBtn(on); toast(on?"Frecce visibili":"Frecce nascoste",on?"check":"close",null,1600);
}
function animFrameBoard(board,plan,k){ const st=plan.states[k]; return {...board,items:board.items.map(i=>({...i,...(st.pos[i.id]||{})})),lines:k===0?board.lines:[]} }

/* lettore: si appoggia sopra a un riquadro con position:relative */
function animPlayer(host,board,phases,o={}){
  board=board&&board.bg==="pitch"?board:cleanBoard(board);
  const n=(phases||[]).length; if(!n) return null;
  host.querySelectorAll(":scope>.apl").forEach(x=>x.remove());
  const plan=animPlan(board,phases), v=clampView(board.view), s=1/v.z, SPEEDS=[.5,1,2];
  let speed=lsGet("qtr.animSpeed",1); if(!SPEEDS.includes(speed)) speed=1;
  const segs=[{k:0,move:false,ms:500}]; plan.durs.forEach((d,i)=>{segs.push({k:i+1,move:true,ms:d});segs.push({k:i+1,move:false,ms:350})});
  const total=segs.reduce((a,x)=>a+x.ms,0);
  const ap=document.createElement("div"); ap.className="apl";
  ap.innerHTML=`<div class="apl-board">${boardSVG({...board,lines:[]},{view:v,under:'<g class="apaths"></g>',label:"Animazione dello svolgimento"})}</div>
    <div class="apl-cap" aria-live="polite"></div><div class="apl-bar" aria-hidden="true"><i></i></div>
    <div class="apl-ctl"><button type="button" data-p="arrows" aria-label="Frecce" aria-pressed="${arrowsOn()}">${ico("run")}</button><button type="button" data-p="toggle" aria-label="Pausa">${ico("pause")}</button><button type="button" data-p="speed" class="mono" aria-label="Velocità">1×</button><button type="button" data-p="close" aria-label="Chiudi l'animazione">${ico("close")}</button></div>`;
  host.appendChild(ap);
  const svgEl=ap.querySelector("svg"), nodes={}; board.items.forEach(i=>{nodes[i.id]=svgEl.querySelector(`.items [data-item="${CSS.escape(i.id)}"]`)});
  const paths=svgEl.querySelector(".apaths"), cap=ap.querySelector(".apl-cap"), bar=ap.querySelector(".apl-bar i");
  let el=0, playing=true, raf=0, last=0, curK=-1, closed=false;
  const sc=` scale(${s.toFixed(4)})`;
  function render(){
    let acc=0, seg=segs[segs.length-1], t=1;
    for(const x of segs){ if(el<acc+x.ms){seg=x;t=(el-acc)/x.ms;break} acc+=x.ms }
    const kk=seg.k, pos=seg.move?framePos(plan,kk,t):plan.states[kk].pos;
    for(const id in pos){ const nd=nodes[id]; if(nd) nd.setAttribute("transform",`translate(${pos[id].x.toFixed(2)} ${pos[id].y.toFixed(2)})${sc}`) }
    if(kk!==curK){ curK=kk; paths.innerHTML=kk>0&&arrowsOn()?stepPathsSVG(plan,kk,s,{faint:true}):"";
      const ti=kk>0?(phases[kk-1].title||"").trim():""; cap.textContent=kk===0?"Inizio":`Fase ${kk} di ${n}${ti?" · "+ti:""}`; if(o.onStep) o.onStep(kk) }
    bar.style.width=(Math.min(1,el/total)*100).toFixed(1)+"%";
  }
  function loop(now){ if(!playing) return; const dt=last?Math.min(100,now-last):0; last=now; el+=dt*speed;
    if(el>=total){ el=total; render(); playing=false; updCtl(); return } render(); raf=requestAnimationFrame(loop) }
  function play(){ if(el>=total){el=0;curK=-1} playing=true; last=0; updCtl(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop) }

  function onKey(e){
    if(e.target.matches("input,textarea")) return;
    const kk=e.key.toLowerCase();
    if((e.metaKey||e.ctrlKey)&&kk==="z"){e.preventDefault();e.shiftKey?redo():undo()}
    else if((e.metaKey||e.ctrlKey)&&kk==="y"){e.preventDefault();redo()}
    else if(e.key==="Escape"){ if(player) stopPlayer(); else if(sel){sel=null;paintBoard();paintUI()} else $('[data-a="close"]',el).click() }
  }
  document.addEventListener("keydown",onKey);
  if(fresh) toast("Fase 1: trascina i giocatori dove arrivano","edit");
}
</script>
<script>
"use strict";
/* ================= STATO ================= */
const DEF_F={focus:[],tags:[],pmin:null,pmax:null,dmax:null,fall:false};
const S={tab:"allenamento",view:"list",id:null,draft:null,dirty:false,armBack:0,armDiscard:0,tagEdit:null,justAdded:null,
  q:lsGet("qtr.q",""),f:{...DEF_F,...lsGet("qtr.f",{})},sort:lsGet("qtr.sort","recent")};
const persistUI=()=>{lsSet("qtr.q",S.q);lsSet("qtr.f",S.f);lsSet("qtr.sort",S.sort)};
const SORTS={recent:"Più recenti",used:"Meno usati di recente",az:"Nome A–Z",dur:"Durata più breve",pl:"Meno giocatori"};

const pAtt=ex=>ex.players?.att??autoPlayers(ex.board).att;
const pDef=ex=>ex.players?.def??boardCounts(ex.board).def;
const pTot=ex=>pAtt(ex)+pDef(ex);
const exFocus=ex=>(ex.focuses||[]).filter(f=>FOC[f]);
const focusLabels=ex=>exFocus(ex).map(f=>FOC[f].l);
function focusShort(ex,max=2){const l=focusLabels(ex);if(!l.length)return `<span class="nofocus">Nessun focus</span>`;return esc(l.slice(0,max).join(" · "))+(l.length>max?` <span class="more">+${l.length-max}</span>`:"")}
const fallHTML=v=>`<div class="seg fall" role="group" aria-label="Esercizi con i focus selezionati"><button type="button" data-fall="0" aria-pressed="${!v}">Almeno uno</button><button type="button" data-fall="1" aria-pressed="${!!v}">Tutti i focus</button></div>`;
const orgOf=ex=>(ex.tags||[]).map(t=>TAG[t]).find(t=>t&&t.g==="org");
const activeCount=()=>S.f.focus.length+S.f.tags.length+(S.f.pmin!=null||S.f.pmax!=null?1:0)+(S.f.dmax!=null?1:0);

function filtered(){
  const q=fold(S.q.trim()), f=S.f;
  const byG={}; f.tags.forEach(t=>{const g=TAG[t]?.g; if(g)(byG[g]=byG[g]||[]).push(t)});
  const xs=Store.items.filter(ex=>{
    if(q){const hay=fold([ex.name,...focusLabels(ex),ex.description,ex.keyPoints,ex.variations,ex.area,...(ex.tags||[]).map(t=>TAG[t]?.l)].join(" "));
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false}
    if(f.focus.length){const fs=ex.focuses||[];if(f.fall&&f.focus.length>1?!f.focus.every(x=>fs.includes(x)):!f.focus.some(x=>fs.includes(x))) return false}
    for(const g in byG) if(!byG[g].some(t=>(ex.tags||[]).includes(t))) return false;
    const p=pTot(ex); if(f.pmin!=null&&p<f.pmin) return false; if(f.pmax!=null&&p>f.pmax) return false;
    if(f.dmax!=null&&(+ex.duration||0)>f.dmax) return false;
    return true;
  });
  const lu=S.sort==="used"?lastUsedMap():null;
  const cmp={used:(a,b)=>(lu[a.id]||"").localeCompare(lu[b.id]||"")||(a.name||"").localeCompare(b.name||"","it"),recent:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),az:(a,b)=>(a.name||"").localeCompare(b.name||"","it"),
    dur:(a,b)=>(+a.duration||0)-(+b.duration||0),pl:(a,b)=>pTot(a)-pTot(b)}[S.sort];
  return xs.sort(cmp||((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)));
}

/* ================= SHEET ================= */
function openSheet({title,body,footer,mount,onClose}){
  const layer=$("#layer"), scrim=document.createElement("div"), sh=document.createElement("div");
  scrim.className="scrim"; sh.className="sheet"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true"); sh.setAttribute("aria-label",title);
  sh.innerHTML=`<div class="grab"></div><header><h2>${esc(title)}</h2><button class="iconbtn" data-x aria-label="Chiudi">${ico("close")}</button></header><div class="sbody">${body}</div>${footer?`<footer>${footer}</footer>`:""}`;
  layer.append(scrim,sh); document.body.style.overflow="hidden";
  let done=false;
  const k=e=>{if(e.key==="Escape")close()};
  const close=()=>{if(done)return;done=true;document.removeEventListener("keydown",k);sh.classList.add("closing");scrim.classList.add("closing");
    setTimeout(()=>{sh.remove();scrim.remove();if(!$(".editor")&&!$(".sheet"))document.body.style.overflow="";dispatchEvent(new Event("qtr:sheetclosed"))},200);onClose&&onClose()};
  scrim.onclick=close; $("[data-x]",sh).onclick=close; document.addEventListener("keydown",k);
  mount&&mount(sh,close);
  setTimeout(()=>$("[data-x]",sh).focus({preventScroll:true}),30);
  return {el:sh,close};
}

/* ================= STATO SINCRONIZZAZIONE ================= */
function renderStatus(){
  const b=$("#syncb"); if(!b) return; const s=Store.status();
  b.className="syncpill "+s.tone; b.setAttribute("aria-label","Stato dati: "+s.label+(s.n?`, ${s.n} da inviare`:"")+". Apri dati e backup");
  b.innerHTML=`<i></i><span>${esc(s.label)}</span>${s.n?`<b>${s.n}</b>`:""}`;
}
function bannersHTML(){
  let h="";
  const dr=Drafts.get();
  if(dr&&!S.draft) h+=`<div class="banner" role="status"><div>${ico("edit")}<span><b>Bozza non salvata</b> · ${esc(dr.d.name||"Senza nome")} · ${esc(ago(dr.at))}</span></div>
    <div class="bactions"><button class="btn ghost sm" data-discard>${S.armDiscard>Date.now()?"Tocca ancora":"Scarta"}</button><button class="btn primary sm" data-resume>Riprendi</button></div></div>`;
  const own=Store.items.filter(e=>!e.example).length, bk=Store.backupAt, snooze=+lsGet("qtr.bsnooze",0)||0;
  if(Store.ready&&own>=3&&Date.now()>snooze&&(!bk||Date.now()-bk>14*864e5))
    h+=`<div class="banner warn" role="status"><div>${ico("download")}<span><b>${bk?"Ultimo backup "+esc(ago(bk)):"Nessun backup ancora"}</b> · ${own} esercizi solo nell'archivio online</span></div>
    <div class="bactions"><button class="btn ghost sm" data-snooze>Più tardi</button><button class="btn primary sm" data-backup>Esporta</button></div></div>`;
  return h;
}

/* ================= LIBRERIA ================= */
function cardHTML(ex,i){
  const c=orgOf(ex);
  return `<button class="card" data-open="${esc(ex.id)}" style="animation-delay:${Math.min(i,10)*28}ms">
    <div class="thumb">${boardSVG(ex.board)}</div>
    <div class="body">
      ${ex.example?`<span class="tag-ex">Esempio</span>`:""}
      <span class="name">${esc(ex.name||"Senza nome")}</span>
      <div class="focus">${focusShort(ex)}</div>
      <div class="meta">
        <span title="Giocatori">${ico("users")}<span class="mono">${pTot(ex)}</span></span>
        <span title="Durata">${ico("clock")}<span class="mono">${+ex.duration||0}′</span></span>
        ${c?`<span>${ico("layers")}${esc(c.l)}</span>`:""}
        ${(ex.phases||[]).length?`<span title="Svolgimento animato">${ico("playf")}<span class="mono">${ex.phases.length}</span> ${ex.phases.length===1?"fase":"fasi"}</span>`:""}
      </div>
    </div></button>`;
}
function activeChips(){
  const f=S.f, out=[];
  f.tags.forEach(t=>TAG[t]&&out.push([`tag:${t}`,TAG[t].l]));
  if(f.pmin!=null||f.pmax!=null) out.push(["players",`Giocatori ${f.pmin??0}–${f.pmax??"∞"}`]);
  if(f.dmax!=null) out.push(["dur",`Fino a ${f.dmax}′`]);
  return out.map(([k,l])=>`<button class="chip active-f x" data-rm="${esc(k)}" aria-label="Rimuovi filtro ${esc(l)}">${esc(l)}${ico("close")}</button>`).join("");
}
function libraryHTML(){
  return `<header class="topbar">${BRAND}<h1><small>Libreria esercizi</small>Allenamento</h1><button class="syncpill" id="syncb"></button><button class="iconbtn" id="tagsbtn" aria-label="Gestisci tag">${ico("tag")}</button></header>
  <div class="banners" id="banners"></div>
  <div class="searchrow">
    <label class="search">${ico("search")}<input id="q" type="search" placeholder="Cerca esercizio, focus, tag" value="${esc(S.q)}" autocomplete="off" aria-label="Cerca"></label>
    <button class="filterbtn" id="fbtn" aria-label="Filtri">${ico("filter")}<span>Filtri</span><span class="n" id="fcount"></span></button>
  </div>
  <div class="chiprail" id="focusrail" aria-label="Filtra per focus"></div>
  <div class="chiprail" id="activef"></div>
  <div class="resultline"><span id="rcount" aria-live="polite"></span><button class="sortbtn" id="sortbtn">${ico("sort")}<span>${SORTS[S.sort]}</span></button></div>
  <div class="list" id="list"></div>`;
}
function updateLibrary(anim){
  const list=$("#list"); if(!list) return;
  renderStatus();
  const bn=$("#banners"); bn.innerHTML=bannersHTML(); bn.hidden=!bn.innerHTML;
  if(Store.taxKnown){S.f.tags=S.f.tags.filter(t=>TAG[t]);S.f.focus=S.f.focus.filter(f=>FOC[f])}
  const fr=$("#focusrail"), fk=FOCUS.map(f=>f.id+":"+f.l).join("|");
  if(fr.dataset.k!==fk){fr.dataset.k=fk;fr.innerHTML=FOCUS.map(f=>`<button class="chip" data-qf="${esc(f.id)}" aria-pressed="false">${esc(f.l)}</button>`).join("")}
  document.querySelectorAll("[data-qf]").forEach(b=>b.setAttribute("aria-pressed",String(S.f.focus.includes(b.dataset.qf))));
  const n=activeCount(); const fb=$("#fbtn"); fb.classList.toggle("on",n>0); $("#fcount").textContent=n?String(n):"";
  const af=$("#activef"); af.innerHTML=(S.f.focus.length>1?fallHTML(S.f.fall):"")+activeChips(); af.hidden=!af.innerHTML;
  if(!Store.ready){$("#rcount").textContent="";list.innerHTML=`<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;return}
  const xs=filtered(), tot=Store.items.length;
  $("#rcount").innerHTML=`<span class="mono">${xs.length}</span> ${xs.length===1?"esercizio":"esercizi"}${xs.length!==tot?` su <span class="mono">${tot}</span>`:""}`;
  if(!tot){
    list.innerHTML=`<div class="empty">${boardSVG({bg:"side",items:[{id:"a",t:"att",x:120,y:190,n:1},{id:"b",t:"att",x:170,y:210,n:2},{id:"c",t:"def",x:250,y:110,n:1},{id:"d",t:"cone",x:80,y:60},{id:"e",t:"cone",x:320,y:60},{id:"f",t:"cone",x:80,y:250},{id:"g",t:"cone",x:320,y:250}],lines:[{id:"l",t:"pass",x1:120,y1:190,x2:165,y2:205},{id:"m",t:"run",x1:170,y1:210,x2:230,y2:130}]}).replace("<svg",'<svg class="art"')}
      <h2>Libreria vuota</h2><p>${Store.offline?"Il server non risponde e sul telefono non c'è ancora una copia. Ricarica la pagina quando hai rete.":"Crea il primo esercizio: nome, focus, tag e la disposizione sulla lavagna."}</p>
      <button class="btn primary" data-new>${ico("plus")}Nuovo esercizio</button></div>`;
    return;
  }
  if(!xs.length){
    list.innerHTML=`<div class="empty"><h2>Nessun risultato</h2><p>Nessun esercizio corrisponde a ricerca e filtri attivi.</p><button class="btn ghost" data-reset>Azzera filtri</button></div>`;
    return;
  }
  list.innerHTML=xs.map(cardHTML).join("");
  if(!anim) list.querySelectorAll(".card").forEach(c=>c.style.animation="none");
}
function bindLibrary(scr){
  const q=$("#q",scr); let t;
  q.addEventListener("input",()=>{S.q=q.value;clearTimeout(t);t=setTimeout(()=>{persistUI();updateLibrary(false)},120)});
  scr.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.open) return go("detail",b.dataset.open);
    if(b.dataset.qf){const id=b.dataset.qf,a=S.f.focus;S.f.focus=a.includes(id)?a.filter(x=>x!==id):[...a,id];persistUI();updateLibrary(false);return}
    if(b.dataset.fall!==undefined){S.f.fall=b.dataset.fall==="1";persistUI();updateLibrary(false);return}
    if(b.dataset.rm){const k=b.dataset.rm;
      if(k.startsWith("tag:"))S.f.tags=S.f.tags.filter(x=>x!==k.slice(4)); else if(k==="players"){S.f.pmin=null;S.f.pmax=null} else if(k==="dur")S.f.dmax=null;
      persistUI();updateLibrary(false);return}
    if(b.hasAttribute("data-reset")){S.f={...DEF_F,focus:[],tags:[]};S.q="";q.value="";persistUI();updateLibrary(true);return}
    if(b.hasAttribute("data-new")) return newExercise();
    if(b.hasAttribute("data-resume")) return resumeDraft();
    if(b.hasAttribute("data-discard")){ if(S.armDiscard>Date.now()){Drafts.clear();S.armDiscard=0;toast("Bozza scartata")} else {S.armDiscard=Date.now()+3000;setTimeout(()=>updateLibrary(false),3100)} updateLibrary(false); return }
    if(b.hasAttribute("data-snooze")){lsSet("qtr.bsnooze",Date.now()+3*864e5);updateLibrary(false);return}
    if(b.hasAttribute("data-backup")) return doExport();
    if(b.id==="syncb") return openDataSheet();
    if(b.id==="tagsbtn") return go("tags");
    if(b.id==="fbtn") return openFilters();
    if(b.id==="sortbtn") return openSort();
  });
}
function openSort(){
  openSheet({title:"Ordina",body:`<div class="optlist">${Object.entries(SORTS).map(([k,l])=>`<button class="opt" data-s="${k}">${l}${S.sort===k?ico("check"):""}</button>`).join("")}</div>`,
    mount:(sh,close)=>sh.addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;S.sort=b.dataset.s;persistUI();
      const sb=$("#sortbtn span");if(sb)sb.textContent=SORTS[S.sort];updateLibrary(true);close()})});
}
function stepperHTML(id,val,label){
  return `<div class="stepper" role="group" aria-label="${esc(label)}"><button type="button" data-step="${id}" data-d="-1" aria-label="Diminuisci">${ico("minus")}</button><output id="${id}" class="${val==null?"dim":""}">${val==null?"—":val}</output><button type="button" data-step="${id}" data-d="1" aria-label="Aumenta">${ico("plus")}</button></div>`;
}
function openFilters(){
  const f=S.f;
  const body=()=>`<button class="sheet-link" data-managetags>${ico("tag")}Modifica tag e focus</button>
    <div class="field"><div class="lbl">Focus <em>uno o più</em></div><div class="chipwrap">${FOCUS.map(x=>`<button class="chip" data-ff="${esc(x.id)}" aria-pressed="${f.focus.includes(x.id)}">${esc(x.l)}</button>`).join("")}</div>${f.focus.length>1?`<div class="fallrow"><span>Mostra gli esercizi con</span>${fallHTML(f.fall)}</div>`:""}</div>
    ${TAG_GROUPS.map(g=>`<div class="field"><div class="lbl">${esc(g.l)}</div><div class="chipwrap">${g.tags.map(t=>`<button class="chip" data-ft="${esc(t.id)}" aria-pressed="${f.tags.includes(t.id)}">${esc(t.l)}</button>`).join("")}</div></div>`).join("")}
    <div class="field"><div class="lbl">Giocatori coinvolti <em>attacco + difesa</em></div><div class="row2">
      <div class="group"><span class="gname">Da</span>${stepperHTML("pmin",f.pmin,"Minimo giocatori")}</div>
      <div class="group"><span class="gname">A</span>${stepperHTML("pmax",f.pmax,"Massimo giocatori")}</div></div></div>
    <div class="field"><div class="lbl">Durata massima</div><div class="chipwrap">${[null,10,15,20,30].map(d=>`<button class="chip" data-fd="${d??""}" aria-pressed="${f.dmax===d}">${d==null?"Qualsiasi":d+" min"}</button>`).join("")}</div></div>`;
  const foot=()=>{const n=filtered().length;return `<button class="btn ghost" data-clear>Azzera</button><button class="btn primary" data-apply>Mostra <span class="mono">${n}</span> ${n===1?"esercizio":"esercizi"}</button>`};
  openSheet({title:"Filtri",body:body(),footer:foot(),onClose:()=>{persistUI();updateLibrary(true)},
    mount:(sh,close)=>{
      const refresh=()=>{const sc=$(".sbody",sh).scrollTop;$(".sbody",sh).innerHTML=body();$(".sbody",sh).scrollTop=sc;$("footer",sh).innerHTML=foot()};
      sh.addEventListener("click",e=>{
        const b=e.target.closest("button"); if(!b) return;
        if(b.dataset.fall!==undefined){f.fall=b.dataset.fall==="1";refresh();return}
        if(b.dataset.ff){const id=b.dataset.ff;f.focus=f.focus.includes(id)?f.focus.filter(x=>x!==id):[...f.focus,id];refresh()}
        else if(b.dataset.ft){const id=b.dataset.ft;f.tags=f.tags.includes(id)?f.tags.filter(x=>x!==id):[...f.tags,id];refresh()}
        else if(b.dataset.fd!==undefined){f.dmax=b.dataset.fd===""?null:+b.dataset.fd;refresh()}
        else if(b.dataset.step){const k=b.dataset.step,d=+b.dataset.d;let v=f[k];
          if(v==null){if(d<0)return;v=k==="pmax"?Math.max(f.pmin??0,6):2}else v+=d;
          if(v<1)v=null; if(k==="pmin"&&v!=null&&f.pmax!=null&&v>f.pmax)f.pmax=v; if(k==="pmax"&&v!=null&&f.pmin!=null&&v<f.pmin)f.pmin=v;
          f[k]=v;refresh()}
        else if(b.hasAttribute("data-clear")){Object.assign(f,{focus:[],tags:[],pmin:null,pmax:null,dmax:null,fall:false});refresh()}
        else if(b.hasAttribute("data-apply")) close();
        else if(b.hasAttribute("data-managetags")){close();setTimeout(()=>go("tags"),210)}
      });
    }});
}
</script>
<script>
"use strict";
/* ================= DATI E BACKUP ================= */
let dataSheet=null;
function dataSheetBody(){
  const s=Store.status(), b=Store.backupAt;
  return `<div class="dstat ${s.tone}"><span class="dot"></span><div><b>${esc(s.label)}${s.n?` · <span class="mono">${s.n}</span> da inviare`:""}</b><p>${esc(s.text)}</p></div></div>
    <div class="dmeta"><span>Ultimo contatto con il server</span><b class="mono">${Store.lastSyncAt?hhmm(Store.lastSyncAt):"—"}</b></div>
    ${s.n&&!Store.offline?`<div class="dbtns"><button class="btn ghost" data-retry>${ico("sync")}Riprova l'invio ora</button></div>`:""}
    ${Store.offline?`<div class="dbtns"><button class="btn ghost" data-reload>${ico("sync")}Ricarica l'app</button></div>`:""}
    <div class="section"><h3>Backup</h3>
      <p class="dnote">Ultimo backup: <b>${b?esc(ago(b)):"mai"}</b>. Il backup è un file .json con esercizi, schemi, calendario e tag. Su iPhone scegli «Salva in File»: con «Importa» lo ricarichi qui senza cancellare nulla, anche se viene dalla versione su Claude.</p>
      <div class="dbtns"><button class="btn primary" data-export>${ico("download")}Esporta backup</button><button class="btn ghost" data-import>${ico("upload")}Importa backup</button></div>
    </div>${accountSectionHTML()}`;
}
function refreshDataSheet(){ if(dataSheet&&dataSheet.el.isConnected) $(".sbody",dataSheet.el).innerHTML=dataSheetBody() }
function openDataSheet(){
  dataSheet=openSheet({title:"Dati e backup",body:dataSheetBody(),onClose:()=>{dataSheet=null},
    mount:(sh,close)=>sh.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      if(b.hasAttribute("data-retry")){Store.retry();toast("Riprovo l'invio","sync")}
      else if(b.hasAttribute("data-reload")){location.reload()}
      else if(b.hasAttribute("data-export")){doExport()}
      else if(b.hasAttribute("data-import")){fileIn.click()}
      else if(b.hasAttribute("data-chpw")){openChangePassword()}
      else if(b.hasAttribute("data-logout")){confirmSignOut()}
    })});
}
function backupName(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `rugby-test-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`}
let exporting=false;
async function doExport(){
  if(exporting) return; exporting=true;
  try{
    const payload={app:"quaderno-tecnico-rugby",edition:"test",schema:2,exportedAt:new Date().toISOString(),count:Store.items.length,exercises:Store.items,taxonomy:TAX,log:Store.logs,plays:Store.plays};
    const text=JSON.stringify(payload,null,1), name=backupName();
    if(Cloud.preview){ let dl=null; try{ dl=await window.claude.use("downloads") }catch{dl=null}
      if(dl){ try{ await dl.save({filename:name,data:text}); Store.setBackupAt(Date.now()); toast("Backup salvato","check"); return }
        catch(e){ const c=e&&e.code; if(c==="declined"){ toast("Backup annullato","close"); return } if(c==="rate_limited"){ toast("C'è già una richiesta aperta: riprova tra poco","close"); return } } }
      openCopySheet(text); return }
    /* iPhone (e Android): foglio di condivisione → «Salva in File», AirDrop, Mail… (va chiamato subito dopo il tocco) */
    let file=null; try{ file=new File([text],name,{type:"application/json"}) }catch{}
    if(file&&navigator.canShare&&navigator.share){ let can=false; try{ can=navigator.canShare({files:[file]}) }catch{}
      if(can){ try{ await navigator.share({files:[file],title:"Backup Quaderno Rugby Test"}); Store.setBackupAt(Date.now()); toast("Backup pronto","check"); return }
        catch(e){ if(e&&e.name==="AbortError"){ toast("Backup annullato","close"); return } } } }
    /* computer: scaricamento diretto */
    if(!/iP(hone|ad|od)/.test(navigator.userAgent)){ try{
      const url=URL.createObjectURL(new Blob([text],{type:"application/json"})), a=document.createElement("a");
      a.href=url; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
      Store.setBackupAt(Date.now()); toast("Backup scaricato","download"); return }catch{} }
    openCopySheet(text);
  } finally { exporting=false }
}
function openCopySheet(text){
  if(dataSheet) dataSheet.close();
  setTimeout(()=>openSheet({title:"Copia il backup",
    body:`<p class="dnote">Questo telefono non mi lascia salvare il file. Copia il testo e incollalo in una nota o in un file di testo: con «Importa» lo potrai ricaricare.</p><textarea class="copyta" id="copyta" readonly aria-label="Testo del backup"></textarea>`,
    footer:`<button class="btn primary" data-copy>${ico("copy")}Copia tutto</button>`,
    mount:(sh,close)=>{ const ta=$("#copyta",sh); ta.value=text;
      $("[data-copy]",sh).onclick=()=>{
        const ok=()=>{Store.setBackupAt(Date.now());toast("Copiato: incollalo in una nota o in un file");close()};
        const sel=()=>{ta.focus();ta.select();toast("Testo selezionato: usa Copia dal menu","close")};
        try{ navigator.clipboard.writeText(text).then(ok,sel) }catch{ sel() }
      } }}),220);
}
const fileIn=document.createElement("input");
fileIn.type="file"; fileIn.accept=".json,application/json,text/plain"; fileIn.hidden=true; document.body.appendChild(fileIn);
fileIn.addEventListener("change",()=>{const f=fileIn.files&&fileIn.files[0]; fileIn.value=""; if(f) readImport(f)});
function readImport(file){
  if(file.size>15*1024*1024) return toast("File troppo grande per essere un backup","close");
  const r=new FileReader();
  r.onerror=()=>toast("Non riesco a leggere il file","close");
  r.onload=()=>{
    let p; try{p=JSON.parse(String(r.result))}catch{return toast("Il file non è un backup valido","close")}
    if(!p||!Array.isArray(p.exercises)) return toast("Il file non contiene esercizi","close");
    const incoming=p.exercises.map(x=>cleanEx(x)).filter(x=>x&&x.name.trim());
    let add=0,upd=0,skip=0; const plan=[];
    incoming.forEach(x=>{const cur=Store.byId(x.id); if(!cur){add++;plan.push(x)} else if(+x.updatedAt>+cur.updatedAt){upd++;plan.push(x)} else skip++});
    const tagOps=[];
    if(p.taxonomy&&Array.isArray(p.taxonomy.groups)) normTax(p.taxonomy).groups.forEach(g=>{ const mine=TAX.groups.find(x=>x.id===g.id); if(!mine) return;
      g.tags.forEach(t=>{ if(ID_RE.test(t.id)&&t.l&&!mine.tags.some(m=>m.id===t.id)&&!tagOps.some(o=>o.id===t.id)) tagOps.push({t:"add",g:g.id,id:t.id,l:t.l}) }) });
    const renOps=[];
    if(p.taxonomy&&Array.isArray(p.taxonomy.groups)) normTax(p.taxonomy).groups.forEach(g=>{ const mine=TAX.groups.find(x=>x.id===g.id); if(!mine) return;
      g.tags.forEach(t=>{ const m=mine.tags.find(x=>x.id===t.id); if(m&&t.l&&t.l!==m.l) renOps.push({t:"ren",g:g.id,id:t.id,l:t.l}) }) });
    const pin=(Array.isArray(p.plays)?p.plays:[]).map(x=>cleanPlay(x)).filter(x=>x&&x.name.trim());
    const pplan=pin.filter(x=>{const cur=Store.playById(x.id);return !cur||+x.updatedAt>+cur.updatedAt});
    const logs=(Array.isArray(p.log)?p.log:[]).map(x=>cleanLog(x)).filter(x=>x&&!Store.logs.some(l=>l.id===x.id));
    const when=p.exportedAt&&!isNaN(new Date(p.exportedAt))?new Date(p.exportedAt).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}):"data sconosciuta";
    const any=plan.length||tagOps.length||logs.length||pplan.length||renOps.length;
    if(dataSheet) dataSheet.close();
    setTimeout(()=>openSheet({title:"Importa backup",
      body:`<p class="dnote">Backup del <b>${esc(when)}</b> con <b class="mono">${incoming.length}</b> esercizi.</p>
        <ul class="implist"><li><b class="mono">${add}</b> nuovi da aggiungere</li><li><b class="mono">${upd}</b> più recenti da aggiornare</li><li><b class="mono">${skip}</b> uguali o più vecchi, lasciati come sono</li><li><b class="mono">${tagOps.length}</b> tag da aggiungere</li><li><b class="mono">${logs.length}</b> voci di calendario da aggiungere</li><li><b class="mono">${pplan.length}</b> schemi nuovi o più recenti</li></ul>
        ${renOps.length?`<label class="chk"><input type="checkbox" id="imp-ren" checked><span>Usa anche i nomi di <b class="mono">${renOps.length}</b> ${renOps.length===1?"tag rinominato":"tag rinominati"} nel backup (es. «${esc(renOps[0].l)}»)</span></label>`:""}
        <p class="dnote">${any?"L'importazione non cancella nulla di quello che c'è già.":"Non c'è niente di nuovo da importare."}</p>`,
      footer:any?`<button class="btn ghost" data-no>Annulla</button><button class="btn primary" data-yes>${ico("upload")}Importa</button>`:`<button class="btn ghost" data-no>Chiudi</button>`,
      mount:(sh,close)=>{ $("[data-no]",sh).onclick=close; const y=$("[data-yes]",sh);
        if(y) y.onclick=()=>{ if(!lock("import")) return; tagOps.forEach(o=>Store.taxOp(o)); const rc=$("#imp-ren",sh); if(rc&&rc.checked) renOps.forEach(o=>Store.taxOp(o)); if(plan.length) Store.putMany(plan); if(logs.length) Store.putLogs(logs); if(pplan.length) Store.putPlays(pplan); close(); toast(`Importati ${plan.length} ${plan.length===1?"esercizio":"esercizi"}${pplan.length?`, ${pplan.length} ${pplan.length===1?"schema":"schemi"}`:""}${tagOps.length?` e ${tagOps.length} tag`:""}`) } }}),220);
  };
  r.readAsText(file);
}

<script>
"use strict";
/* ================= ACCESSO E ARCHIVIO ONLINE (Firebase) =================
   Firebase Authentication con email e password (gli account si creano dalla console, qui non c'è registrazione)
   e Firestore con le stesse raccolte di prima: exercises, plays, log, config.
   Chi può leggere e scrivere lo decidono le regole di Firestore: solo chi ha un documento in "allenatori". */
const Cloud=(()=>{
  /* ANTEPRIMA: dentro Claude (artifact) l'app non usa mai Firebase e non tocca i dati degli allenatori:
     niente accesso, i dati sono quelli dell'archivio dell'artifact. Su github.io non è mai anteprima. */
  const inClaude=()=>!!(window.claude&&typeof window.claude.use==="function")&&!/\.github\.io$/i.test(location.hostname);
  let PREVIEW=false;
  const cfg=(typeof firebaseConfig!=="undefined"&&firebaseConfig)||window.FIREBASE_CONFIG||null;
  const configured=!!(cfg&&typeof cfg==="object"&&typeof cfg.apiKey==="string"&&cfg.apiKey.length>10&&cfg.projectId&&!/INCOLLA/i.test(JSON.stringify(cfg)));
  const sdk=typeof window.firebase!=="undefined"&&typeof firebase.auth==="function"&&typeof firebase.firestore==="function";
  let auth=null, fs=null, user=null, started=false, onReady=null, deniedCheck=null;
  const okKey=uid=>"qrt.ok."+uid;
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);

  function init(){
    if(auth) return true; if(!configured||!sdk) return false;
    firebase.initializeApp(cfg);
    auth=firebase.auth(); auth.languageCode="it";
    fs=firebase.firestore();
    try{ fs.settings({ignoreUndefinedProperties:true}) }catch{}
    return true;
  }

  /* archivio per lo Store: stessa forma dell'archivio di prima (collection().doc().set/delete, onSnapshot).
     Arrivano allo Store solo le fotografie del server: quelle dalla memoria del telefono (fromCache) non
     cancellano la copia locale quando si apre l'app senza rete. */
  function db(){
    if(PREVIEW) return Promise.resolve().then(()=>window.claude.use("db")).catch(()=>null);
    if(!fs||!user) return null;
    const col=c=>{ const ref=fs.collection(c); return {
      doc:id=>ref.doc(id),
      onSnapshot:(next,err,onCache)=>ref.onSnapshot({includeMetadataChanges:true},
        s=>{ if(s.metadata.fromCache){ if(onCache) onCache(s); return } next(s) },
        e=>{ if(e&&e.code==="permission-denied") recheck(); if(err) err(e) })
    } };
    return {collection:col,doc:p=>fs.doc(p)};
  }

  /* l'account è tra gli allenatori autorizzati? (documento allenatori/<uid> creato dalla console) */
  async function allowed(u){
    try{ const s=await withTimeout(fs.doc("allenatori/"+u.uid).get(),9000); lsSet(okKey(u.uid),!!s.exists); return !!s.exists }
    catch(e){ if(e&&e.code==="permission-denied"){ lsSet(okKey(u.uid),false); return false } return lsGet(okKey(u.uid),null)!==false } // senza rete: vale l'ultima verifica
  }
  function recheck(){
    if(!user||deniedCheck) return;
    deniedCheck=allowed(user).then(ok=>{ deniedCheck=null; if(!ok) gate("denied") });
  }

  /* ---------- schermata di accesso ---------- */
  let gateEl=null;
  const msg={
    "auth/invalid-credential":"Email o password non corretti.","auth/invalid-login-credentials":"Email o password non corretti.",
    "auth/wrong-password":"Email o password non corretti.","auth/user-not-found":"Email o password non corretti.",
    "auth/invalid-email":"L'indirizzo email non è scritto correttamente.","auth/missing-password":"Scrivi la password.",
    "auth/user-disabled":"Questo account è stato disattivato.","auth/too-many-requests":"Troppi tentativi: aspetta qualche minuto e riprova.",
    "auth/network-request-failed":"Nessuna connessione: per entrare serve la rete (dopo, l'app funziona anche senza).",
    "auth/operation-not-allowed":"Nel progetto Firebase l'accesso con email e password non è attivo.",
    "auth/weak-password":"La nuova password è troppo corta: almeno 6 caratteri.",
    "auth/password-does-not-meet-requirements":"La nuova password non rispetta i requisiti del progetto.",
    "auth/requires-recent-login":"Per sicurezza esci, rientra e riprova."
  };
  const errText=e=>msg[e&&e.code]||"Qualcosa non ha funzionato. Riprova tra poco.";
  const BIG=BRAND.replace('class="brand"','class="glogo"');
  function gate(kind,extra){
    if(!gateEl){ gateEl=document.createElement("div"); gateEl.className="gate"; document.body.appendChild(gateEl) }
    gateEl.hidden=false; document.body.classList.add("gated");
    const head=`${BIG}<h1 class="gname">Quaderno Rugby Test</h1><span class="gbadge">Versione di prova</span>`;
    if(kind==="loading"){ gateEl.innerHTML=`<div class="gcard gwait">${head}</div>`; return }
    if(kind==="setup"){ gateEl.innerHTML=`<div class="gcard">${head}<p class="gerr">Manca la configurazione di Firebase, oppure contiene un errore.</p><p class="gtext">Apri il file <b>firebase-config.js</b> e incolla al posto dell'esempio il blocco <b>const firebaseConfig = { … };</b> della tua app Firebase.</p></div>`; return }
    if(kind==="nosdk"){ gateEl.innerHTML=`<div class="gcard">${head}<p class="gerr">Per il primo avvio serve la connessione.</p><p class="gtext">Dopo il primo accesso l'app si apre anche senza rete.</p><button class="btn primary block" data-g="reload">${ico("sync")}Riprova</button></div>`; bindGate(); return }
    if(kind==="denied"){ gateEl.innerHTML=`<div class="gcard">${head}<p class="gerr">Questo account non è tra gli allenatori autorizzati.</p><p class="gtext">Sei entrato come <b>${esc(user&&user.email||"")}</b>. Chiedi all'allenatore responsabile di aggiungerti, poi riapri l'app.</p><button class="btn ghost block" data-g="retry">${ico("sync")}Controlla di nuovo</button><button class="btn ghost block" data-g="out">${ico("logout")}Esci</button></div>`; bindGate(); return }
    const last=lsGet("qrt.lastEmail","");
    gateEl.innerHTML=`<div class="gcard">${head}
      <form class="gform" novalidate>
        <label class="field"><span class="lbl">Email</span><input class="input" id="g-email" type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(extra&&extra.email||last)}"></label>
        <label class="field"><span class="lbl">Password</span><span class="pwrow"><input class="input" id="g-pw" type="password" name="password" autocomplete="current-password"><button type="button" class="iconbtn" data-g="eye" aria-label="Mostra la password" aria-pressed="false">${ico("eye")}</button></span></label>
        <p class="gerr" role="alert" hidden></p><p class="gok" role="status" hidden></p>
        <button class="btn primary block" type="submit" data-g="in">Entra</button>
        <button class="linkbtn" type="button" data-g="forgot">Password dimenticata?</button>
      </form>
      <p class="gnote">Gli account li crea l'allenatore responsabile: qui non ci si registra.</p></div>`;
    bindGate();
    const em=$("#g-email",gateEl); setTimeout(()=>{ try{ (em.value?$("#g-pw",gateEl):em).focus({preventScroll:true}) }catch{} },60);
  }
  function hideGate(){ if(gateEl){ gateEl.hidden=true; gateEl.innerHTML="" } document.body.classList.remove("gated") }
  function bindGate(){
    const say=(t,ok)=>{ const e=$(".gerr",gateEl), o=$(".gok",gateEl); if(!e) return; e.hidden=ok||!t; o.hidden=!ok||!t; (ok?o:e).textContent=t||"" };
    const f=$(".gform",gateEl);
    if(f) f.addEventListener("submit",async ev=>{
      ev.preventDefault(); const email=$("#g-email",gateEl).value.trim(), pw=$("#g-pw",gateEl).value, btn=$('[data-g="in"]',gateEl);
      if(!email||!pw) return say(!email?"Scrivi la tua email.":"Scrivi la password.");
      btn.disabled=true; btn.textContent="Accesso…"; say("");
      try{ await auth.signInWithEmailAndPassword(email,pw); lsSet("qrt.lastEmail",email) }
      catch(e){ say(errText(e)); btn.disabled=false; btn.textContent="Entra" }
    });
    gateEl.onclick=async ev=>{
      const b=ev.target.closest("[data-g]"); if(!b) return; const g=b.dataset.g;
      if(g==="reload") location.reload();
      else if(g==="eye"){ const i=$("#g-pw",gateEl), on=i.type==="password"; i.type=on?"text":"password"; b.setAttribute("aria-pressed",String(on)); b.setAttribute("aria-label",on?"Nascondi la password":"Mostra la password"); b.innerHTML=ico(on?"eyeoff":"eye") }
      else if(g==="forgot"){
        const email=$("#g-email",gateEl).value.trim();
        if(!email) return say("Scrivi la tua email qui sopra, poi tocca «Password dimenticata?».");
        b.disabled=true;
        try{ await auth.sendPasswordResetEmail(email); say(`Se ${email} è tra gli account, ti arriva un'email per scegliere una nuova password. Poi torna qui ed entra con quella.`,true) }
        catch(e){ if(e&&e.code==="auth/user-not-found") say(`Se ${email} è tra gli account, ti arriva un'email per scegliere una nuova password. Poi torna qui ed entra con quella.`,true); else say(errText(e)) }
        b.disabled=false;
      }
      else if(g==="retry"){ b.disabled=true; const ok=await allowed(user); if(ok) location.reload(); else { b.disabled=false; toast("Ancora non autorizzato","close") } }
      else if(g==="out") signOut(true);
    };
  }

  /* ---------- avvio ---------- */
  function enterPreview(){
    PREVIEW=true; document.body.classList.add("preview"); document.title="Quaderno Anteprima"; start();
  }
  function boot(ready){
    onReady=ready;
    if(inClaude()){ enterPreview(); return }
    if(!configured){ gate("setup");
      let n=0; const t=setInterval(()=>{ if(inClaude()){ clearInterval(t); enterPreview() } else if(++n>=15) clearInterval(t) },200); // Claude arrivato in ritardo
      return }
    if(!sdk){ gate("nosdk"); return }
    init(); gate("loading");
    auth.onAuthStateChanged(async u=>{
      if(!u){ if(started){ location.reload(); return } user=null; gate("login"); return }
      user=u;
      const known=lsGet(okKey(u.uid),null);
      if(known===true){ start(); allowed(u).then(ok=>{ if(!ok) gate("denied") }); return } // già verificato: si parte subito, anche senza rete
      gate("loading");
      if(await allowed(u)) start(); else gate("denied");
    });
  }
  function start(){
    hideGate(); if(started) return; started=true;
    try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch{}
    onReady();
  }

  /* ---------- account: cambia password, esci ---------- */
  const LOCAL_KEYS=["qtr.cache.v2","qtr.outbox.v2","qtr.draft.v2","qtr.draft.play"];
  async function signOut(force){
    try{ S.dirty=false; P.dirty=false }catch{} // all'uscita non si risalvano bozze
    LOCAL_KEYS.forEach(k=>lsDel(k));
    try{ Object.keys(localStorage).filter(k=>k.startsWith("qrt.ok.")).forEach(k=>localStorage.removeItem(k)) }catch{}
    try{ await withTimeout(auth.signOut(),4000) }catch{}
    location.reload();
  }
  async function changePassword(cur,next){
    const u=auth.currentUser; if(!u) throw {code:"auth/requires-recent-login"};
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));
    await u.updatePassword(next);
  }
  return {boot,db,signOut,changePassword,errText,get email(){return user&&user.email||""},get configured(){return configured},get preview(){return PREVIEW}};
})();

/* ---------- pannello Dati e backup: account ---------- */
function accountSectionHTML(){
  if(Cloud.preview) return `<div class="section"><h3>Anteprima</h3>
    <p class="dnote">Questa è l'anteprima su Claude: niente accesso, e i dati sono quelli di prova salvati in Claude. I dati degli allenatori su Firebase non vengono mai letti né modificati.</p></div>`;
  return `<div class="section"><h3>Account</h3>
    <p class="dnote">Sei entrato come <b>${esc(Cloud.email||"—")}</b>.</p>
    <div class="dbtns"><button class="btn ghost" data-chpw>${ico("key")}Cambia password</button><button class="btn ghost" data-logout style="color:var(--danger)">${ico("logout")}Esci</button></div></div>`;
}
function openChangePassword(){
  if(dataSheet) dataSheet.close();
  setTimeout(()=>openSheet({title:"Cambia password",
    body:`<form class="pwform" novalidate>
        <input type="email" autocomplete="username" value="${esc(Cloud.email)}" hidden readonly>
        <label class="field"><span class="lbl">Password attuale</span><input class="input" id="pw-cur" type="password" autocomplete="current-password"></label>
        <label class="field"><span class="lbl">Nuova password <em>almeno 6 caratteri</em></span><input class="input" id="pw-new" type="password" autocomplete="new-password"></label>
        <label class="field"><span class="lbl">Ripeti la nuova password</span><input class="input" id="pw-new2" type="password" autocomplete="new-password"></label>
        <p class="gerr" role="alert" hidden></p></form>`,
    footer:`<button class="btn ghost" data-no>Annulla</button><button class="btn primary" data-yes>${ico("check")}Cambia</button>`,
    mount:(sh,close)=>{
      const err=$(".gerr",sh), say=t=>{err.hidden=!t;err.textContent=t||""};
      $("[data-no]",sh).onclick=close;
      const go=async()=>{
        const cur=$("#pw-cur",sh).value, a=$("#pw-new",sh).value, b=$("#pw-new2",sh).value, y=$("[data-yes]",sh);
        if(!cur) return say("Scrivi la password attuale.");
        if(a.length<6) return say("La nuova password è troppo corta: almeno 6 caratteri.");
        if(a!==b) return say("Le due nuove password non sono uguali.");
        if(a===cur) return say("La nuova password è uguale a quella attuale.");
        y.disabled=true; say("");
        try{ await Cloud.changePassword(cur,a); close(); toast("Password cambiata","check") }
        catch(e){ const c=e&&e.code; say(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/invalid-login-credentials"?"La password attuale non è corretta.":Cloud.errText(e)); y.disabled=false }
      };
      $("[data-yes]",sh).onclick=go;
      $("form",sh).addEventListener("submit",e=>{e.preventDefault();go()});
      setTimeout(()=>{try{$("#pw-cur",sh).focus({preventScroll:true})}catch{}},280);
    }}),220);
}
function confirmSignOut(){
  const n=Store.status().n;
  if(dataSheet) dataSheet.close();
  setTimeout(()=>openSheet({title:"Esci dall'account",
    body:`<p class="dnote">${n?`<b>Attenzione:</b> sul telefono ${n===1?"c'è":"ci sono"} <b class="mono">${n}</b> ${n===1?"modifica non ancora inviata":"modifiche non ancora inviate"} al server. Se esci adesso ${n===1?"va persa":"vanno perse"}: meglio aspettare di avere rete.`
      :"Esci da questo telefono. Per rientrare servono email, password e la connessione."} La copia degli esercizi salvata sul telefono viene cancellata; sul server resta tutto.</p>`,
    footer:`<button class="btn ghost" data-no>Annulla</button><button class="btn danger" data-yes>${ico("logout")}${n?"Esci lo stesso":"Esci"}</button>`,
    mount:(sh,close)=>{ $("[data-no]",sh).onclick=close; $("[data-yes]",sh).onclick=()=>{ $("[data-yes]",sh).disabled=true; Cloud.signOut(true) } }}),220);
}

<script>
"use strict";
/* ================= CALENDARIO ================= */
const MONTHS=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const WD=["L","M","M","G","V","S","D"];
const p2=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dkey(new Date());
const fmtDay=(k,long)=>parseKey(k).toLocaleDateString("it-IT",long?{weekday:"long",day:"numeric",month:"long"}:{day:"numeric",month:"short"});
const joinIt=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];
const teamOrder=ts=>TEAMS.map(t=>t.id).filter(id=>ts.includes(id));
const teamLabel=ts=>joinIt(teamOrder(Array.isArray(ts)?ts:ts==="both"?["u16","u18"]:[ts]).map(id=>TEAM[id].l));
const C={month:null,sel:null,team:(()=>{const t=lsGet("qtr.calTeam","all");return t==="all"||TEAM[t]?t:"all"})()};
function lastUsedMap(){const m={};Store.logs.forEach(l=>{if(!m[l.exId]||l.date>m[l.exId])m[l.exId]=l.date});return m}
function logsFor(date){return Store.logs.filter(l=>l.date===date&&(C.team==="all"||l.team===C.team))}
function calHTML(){
  if(!C.month){const t=new Date();C.month=`${t.getFullYear()}-${p2(t.getMonth()+1)}`;}
  if(!C.sel) C.sel=todayKey();
  const [y,m]=C.month.split("-").map(Number), days=new Date(y,m,0).getDate(), offset=(new Date(y,m-1,1).getDay()+6)%7, tk=todayKey();
  const by={}; Store.logs.forEach(l=>{ if(C.team!=="all"&&l.team!==C.team) return; if(!l.date.startsWith(C.month)) return; (by[l.date]=by[l.date]||[]).push(l) });
  const nDays=Object.keys(by).length, nEx=Object.values(by).reduce((s,a)=>s+a.length,0);
  let cells=WD.map(w=>`<span class="wd" aria-hidden="true">${w}</span>`).join("")+Array.from({length:offset},()=>`<span class="cpad"></span>`).join("");
  for(let d=1;d<=days;d++){
    const k=`${C.month}-${p2(d)}`, ls=by[k]||[], teams=TEAMS.filter(t=>ls.some(l=>l.team===t.id));
    cells+=`<button class="cday${k===C.sel?" sel":""}${k===tk?" today":""}${ls.length?" has":""}" data-day="${k}" aria-pressed="${k===C.sel}" aria-label="${esc(fmtDay(k,true))}${ls.length?`, ${ls.length} esercizi`:""}"><span>${d}</span><i class="dots">${teams.map(t=>`<b class="t-${t.id}"></b>`).join("")}</i></button>`;
  }

function exRow(l,removable){

/* squadre: una o più (U14, U16, U18) */
function teamSegHTML(cur){return `<div class="seg teamseg" role="group" aria-label="Squadre, una o più">${TEAMS.map(t=>`<button type="button" data-pteam="${t.id}" aria-pressed="${cur.includes(t.id)}">${t.l}</button>`).join("")}</div>`}
function initialTeam(){

const toggleTeam=(cur,t)=>cur.includes(t)?(cur.length>1?cur.filter(x=>x!==t):cur):teamOrder([...cur,t]);
function newLogs(date,teams,exIds){
  const have=new Set(Store.logs.map(l=>l.id)), out=[];

function openLogPicker(date){
  let team=initialTeam(), q=""; const chosen=new Set(); const lu=lastUsedMap();
  const doneFor=exId=>team.every(t=>Store.logs.some(l=>l.id===logId(date,t,exId)));
  const listHTML=()=>{
    const fq=fold(q.trim()); const xs=Store.items.filter(ex=>!fq||fold([ex.name,...focusLabels(ex),...(ex.tags||[]).map(t=>TAG[t]?.l)].join(" ")).includes(fq))

  };
  const foot=()=>`<button class="btn primary block" data-confirm${chosen.size?"":" disabled"}>${ico("plus")}Aggiungi ${chosen.size||""} ${chosen.size===1?"esercizio":"esercizi"}</button>`;
  openSheet({title:"Aggiungi al "+fmtDay(date),
    body:`<div class="field"><div class="lbl">Squadra <em>una o più</em></div><div id="pteam">${teamSegHTML(team)}</div></div>
      <label class="search">${ico("search")}<input id="pq" type="search" placeholder="Cerca nel catalogo" autocomplete="off" aria-label="Cerca nel catalogo"></label>
      <div class="picklist" id="plist">${listHTML()}</div>`,
    footer:foot(),
    mount:(sh,close)=>{
      const refresh=()=>{$("#plist",sh).innerHTML=listHTML();$("footer",sh).innerHTML=foot()};
      $("#pq",sh).addEventListener("input",e=>{q=e.target.value;$("#plist",sh).innerHTML=listHTML()});
      sh.addEventListener("click",e=>{
        const b=e.target.closest("button"); if(!b) return;
        if(b.dataset.pteam){team=toggleTeam(team,b.dataset.pteam);$("#pteam",sh).innerHTML=teamSegHTML(team);[...chosen].forEach(id=>{if(doneFor(id))chosen.delete(id)});refresh();return}
        if(b.dataset.pick){const id=b.dataset.pick; chosen.has(id)?chosen.delete(id):chosen.add(id); b.classList.toggle("on",chosen.has(id)); b.setAttribute("aria-pressed",String(chosen.has(id))); $("footer",sh).innerHTML=foot(); return}
        if(b.hasAttribute("data-confirm")){
          if(!chosen.size||!lock("logadd")) return;
          const ls=newLogs(date,team,[...chosen]); Store.putLogs(ls); lsSet("qtr.lastTeams",team); close();
          toast(`${chosen.size} ${chosen.size===1?"esercizio aggiunto":"esercizi aggiunti"} · ${teamLabel(team)}`);
        }
      });
    }});
}
function openMarkDone(ex){
  let when=todayKey(), team=initialTeam();
  const yk=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d)};
  const whenHTML=()=>`<div class="chipwrap"><button type="button" class="chip" data-when="${todayKey()}" aria-pressed="${when===todayKey()}">Oggi</button><button type="button" class="chip" data-when="${yk()}" aria-pressed="${when===yk()}">Ieri</button>
    <input class="input dateinp" type="date" id="mdate" value="${when}" max="${todayKey()}" aria-label="Scegli un altro giorno"></div>`;
  openSheet({title:"Segna come fatto",
    body:`<p class="dnote"><b>${esc(ex.name||"Senza nome")}</b></p>
      <div class="field"><div class="lbl">Quando</div><div id="mwhen">${whenHTML()}</div><span class="muted" id="mwhenl">${esc(fmtDay(when,true))}</span></div>
      <div class="field"><div class="lbl">Squadra <em>una o più</em></div><div id="pteam">${teamSegHTML(team)}</div></div>`,
    footer:`<button class="btn primary block" data-confirm>${ico("calcheck")}Segna come fatto</button>`,
    mount:(sh,close)=>{
      const upd=()=>{$("#mwhen",sh).innerHTML=whenHTML();$("#mwhenl",sh).textContent=fmtDay(when,true);bindDate()};
      const bindDate=()=>$("#mdate",sh).addEventListener("change",e=>{if(DATE_RE.test(e.target.value)){when=e.target.value;$("#mwhenl",sh).textContent=fmtDay(when,true);sh.querySelectorAll("[data-when]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.when===when)))}});
      bindDate();
      sh.addEventListener("click",e=>{
        const b=e.target.closest("button"); if(!b) return;
        if(b.dataset.when){when=b.dataset.when;upd();return}
        if(b.dataset.pteam){team=toggleTeam(team,b.dataset.pteam);$("#pteam",sh).innerHTML=teamSegHTML(team);return}
        if(b.hasAttribute("data-confirm")){
          if(!lock("markdone")) return;
          const ls=newLogs(when,team,[ex.id]); if(ls.length) Store.putLogs(ls); lsSet("qtr.lastTeams",team); close();
          const day=when; toast(ls.length?`Segnato: ${fmtDay(day)} · ${teamLabel(team)}`:`Era già segnato il ${fmtDay(day)}`,"calcheck",{label:"Vedi",run:()=>gotoDay(day)});
        }
      });
    }});
}
function historyHTML(ex){
  const ls=Store.logs.filter(l=>l.exId===ex.id).sort((a,b)=>b.date.localeCompare(a.date)||a.team.localeCompare(b.team));
  if(!ls.length) return `<div class="section"><h3>Calendario</h3><p class="muted">Mai segnato nel calendario.</p></div>`;
  const days=[...new Set(ls.map(l=>l.date))], last=days[0], lastTeams=teamLabel(ls.filter(l=>l.date===last).map(l=>l.team));

    <div class="hist">${ls.slice(0,10).map(l=>`<button class="chip hchip" data-goday="${l.date}"><b class="tdot t-${l.team}"></b>${esc(fmtDay(l.date))} · ${esc(TEAM[l.team]?.l||"")}</button>`).join("")}</div></div>`;
}

<script>
"use strict";
/* ================= SCHEMI (lanci di gioco) =================
   Dati di uno schema: board = disposizione iniziale (pedine con id stabili);
   phases[] = fasi della giocata. Ogni fase ha già i campi per l'animazione:
   pos {idPedina:{x,y}} posizioni a fine fase, ball = id di chi ha la palla,
   lines = frecce della fase, dur = durata in ms. Per ora si compilano titolo e testo. */
const P={view:"list",id:null,draft:null,dirty:false,armBack:0,lastKey:"",
  q:lsGet("qtr.pq",""),f:{sit:[],zona:[],...lsGet("qtr.pf",{})},sort:lsGet("qtr.psort","recent")};
const persistP=()=>{lsSet("qtr.pq",P.q);lsSet("qtr.pf",P.f);lsSet("qtr.psort",P.sort)};
const PSORTS={recent:"Più recenti",az:"Nome A–Z",phases:"Più fasi"};
const sitL=p=>PTAG[p.situation]?.l||"";
const zoneLs=p=>(p.zones||[]).map(z=>PTAG[z]?.l).filter(Boolean);
const pGroup=id=>TAX.groups.find(g=>g.id===id)||{id,l:id,tags:[]};
function normPlayDraft(d){ d=upgradePlayPitch(upgradePlay(d)); if(!Array.isArray(d.zones)) d.zones=[]; if(!Array.isArray(d.phases)) d.phases=[]; d.board=d.board?cleanBoard(d.board):emptyBoard(); return d }
const newPhase=i=>({id:uid("ph"),title:"",text:"",pos:{},ball:null,lines:[],dur:1500});
/* --- disposizione tipo dei trequarti, attacco verso l'alto
   (metri: X dalla linea laterale sinistra 0–70, D dalla linea di meta 0–50) --- */
const FX=m=>+W.x(Math.max(1.5,Math.min(68.5,m))).toFixed(1), FY=dd=>+W.y(Math.max(1.5,Math.min(49,dd))).toFixed(1);
const startDepth=zones=>{const z=(zones||[])[0];return z==="loro-5m"?7:z==="loro-22"?16:z==="loro-meta"?27:24};
const START_DEF={type:"lineout",side:"l",def:true};
const START_TYPES=[["lineout","Touche"],["scrum","Mischia"],["ruck","Punto d'incontro"]];
const START_SIDE={lineout:"l",scrum:"c",ruck:"l"};
const START_SIT={lineout:"touche",scrum:"mischia",ruck:"punto-incontro"};
const START_SHAPES={
  lineout:{o:{l:0,r:70},nine:[9,3],a:{10:[17,12],12:[25,13],13:[33,14],open:[56,14],blind:[42,24],15:[26,25]},gap:10,d9:[9,-2],ball:[1,0]},
  scrum:{o:{l:15,c:35,r:55},nine:[2,4.4],a:{10:[8,10],12:[15,11],13:[22,12],open:[40,12],blind:[-12,11],15:[12,22]},gap:8,d9:[-1.5,-4],ball:[-1.8,2.6]}
};
/* Punto d'incontro: inquadratura su metà campo in larghezza, il 9 e i primi quattro.
   M = metri del raggruppamento dalla linea laterale vicina (destra se right); a = +1 si attacca verso il centro, −1 verso la laterale */
const RUCK_VIEW={l:{right:false,M:12,a:1},c:{right:true,M:32,a:-1},r:{right:true,M:12,a:1}};
const RUCK_FRAME={false:{x:103.6,y:80.4,z:1.929},true:{x:296.4,y:80.4,z:1.929}};
const ruckDepth=zones=>{const z=(zones||[])[0];return z==="loro-5m"?6:z==="loro-22"?14:11};
function ruckPreset(s,zones){
  const R=RUCK_VIEW[s.side]||RUCK_VIEW.l, F=W, Dr=ruckDepth(zones), items=[];
  const Xof=dm=>{const m=R.M+R.a*dm; return R.right?70-m:m};
  const toRight=Xof(10)>Xof(0), open=toRight?14:11;
  const add=(id,t,dm,dd,n)=>{const it={id,t,x:+F.x(Xof(dm)).toFixed(1),y:+F.y(Dr+dd).toFixed(1)}; if(n!=null) it.n=n; items.push(it)};
  add("a9","sh",1.2,2.8);
  const A=[[10,5.5,6],[12,10.5,7],[13,15.5,8],[open,21.5,8.5]];
  A.forEach(([n,dm,dd])=>add("a"+n,"att",dm,dd,n));
  if(s.def!==false){
    add("d9","def",-1.2,-2.2,9);
    A.forEach(([n,dm])=>{const dn=n===14?11:n===11?14:n; add("d"+dn,"def",dm-1,-2.4,dn)});
  }
  add("ball","ball",0,0.6);
  return cleanBoard({bg:"pitch",items,lines:[],areas:[],view:RUCK_FRAME[R.right]});
}
function backsPreset(start,zones){
  const s=start||START_DEF;
  if(s.type==="ruck") return ruckPreset(s,zones);
  const sh=START_SHAPES[s.type]||START_SHAPES.lineout, side=s.type==="lineout"&&s.side==="c"?"l":s.side;
  const dir=side==="r"?-1:1, Xo=sh.o[side]??sh.o.l, Dg=startDepth(zones), items=[];
  const add=(id,t,X,Dv,n)=>{const it={id,t,x:FX(X),y:FY(Dv)}; if(n!=null) it.n=n; items.push(it)};
  add("a9","sh",Xo+dir*sh.nine[0],Dg+sh.nine[1]);
  const num={10:10,12:12,13:13,15:15,open:dir>0?14:11,blind:dir>0?11:14}, att={};
  for(const k of ["10","12","13","open","blind","15"]){ const [dx,dd]=sh.a[k], n=num[k]; att[n]=[Xo+dir*dx,Dg+dd]; add("a"+n,"att",att[n][0],att[n][1],n) }
  if(s.def!==false){
    add("d9","def",Xo+dir*sh.d9[0],Dg+sh.d9[1],9);
    const Dline=Math.max(2,Dg-sh.gap), deep=Dg-20;
    for(const n of [10,12,13,11,14]){ const [X]=att[n], dn=n===14?11:n===11?14:n; add("d"+dn,"def",X-dir*1.5,Dline,dn) }
    const cx=v=>Math.max(1.5,Math.min(68.5,v));
    if(deep>=2&&deep<=Dline-5) add("d15","def",att[15][0]-dir*1.5,deep,15);
    else add("d15","def",(cx(att[13][0])+cx(att[num.open][0]))/2,Math.max(2,Dline-3),15);
  }
  add("ball","ball",Xo+dir*sh.ball[0],Dg+sh.ball[1]);
  return cleanBoard({bg:"pitch",items,lines:[],areas:[],view:DEF_VIEW});
}
const boardKey=b=>{const c=cleanBoard(b);return JSON.stringify([c.items,c.lines,c.areas])}; // lo zoom non conta come modifica
const pristine=d=>(!d.board.items.length&&!d.board.lines.length)||(!!d._genKey&&boardKey(d.board)===d._genKey);
function applyStart(d){ d.board=backsPreset(d.start,d.zones); d._genKey=boardKey(d.board) }
/* la situazione segue la partenza finché non ne scegli a mano una diversa */
function syncSituation(d){ const m=START_SIT[d.start&&d.start.type], auto=Object.values(START_SIT); if(m&&PTAG[m]&&(!d.situation||auto.includes(d.situation))) d.situation=m }
function startHTML(d){
  const s=d.start, note=!s?"Scegli una partenza per avere la disposizione tipo, oppure disegna la lavagna da zero."
    :pristine(d)?(s.type==="ruck"?"Zoom sul punto d'incontro con il 9 e i primi quattro. La lavagna segue queste scelte finché non la modifichi a mano; per vedere tutto il campo riduci lo zoom nella lavagna.":"La lavagna segue queste scelte finché non la modifichi a mano: poi sistemi le posizioni nel dettaglio.")
    :"Hai già sistemato la lavagna a mano: toccando Touche, Mischia, Punto d'incontro o il lato la sostituisci con la disposizione tipo.";
  return `<div class="field"><div class="lbl">Partenza <em>trequarti dal 9 al 15</em></div>
    <div class="seg st-seg" role="group" aria-label="Fase di partenza">${START_TYPES.map(([id,l])=>`<button type="button" data-stype="${id}" aria-pressed="${!!s&&s.type===id}">${l}</button>`).join("")}</div>
    ${s?`<div class="seg st-seg" role="group" aria-label="Lato del campo">${[["l","Sinistra"],["c","Centro"],["r","Destra"]].map(([id,l])=>`<button type="button" data-sside="${id}" aria-pressed="${s.side===id}"${s.type==="lineout"&&id==="c"?" disabled":""}>${l}</button>`).join("")}</div>
    <div class="chipwrap"><button type="button" class="chip" data-sdef aria-pressed="${s.def!==false}">Difesa avversaria</button></div>`:""}
    <span class="auto-note">${note}</span></div>`;
}
const pkey=p=>p?JSON.stringify(p)+PLAY_GROUPS.map(g=>g.tags.map(t=>t.id+t.l).join()).join():"";

function pfiltered(){
  const q=fold(P.q.trim()), f=P.f;
  const xs=Store.plays.filter(p=>{
    if(q){const hay=fold([p.name,sitL(p),...zoneLs(p),p.description,p.keyPoints,p.notes,...p.phases.map(ph=>ph.title+" "+ph.text)].join(" "));
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false}
    if(f.sit.length&&!f.sit.includes(p.situation)) return false;
    if(f.zona.length&&!(p.zones||[]).includes("tutto")&&!f.zona.some(z=>(p.zones||[]).includes(z))) return false; // "Tutto il campo" vale per ogni zona
    return true;
  });
  const cmp={recent:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),az:(a,b)=>(a.name||"").localeCompare(b.name||"","it"),phases:(a,b)=>b.phases.length-a.phases.length}[P.sort]||((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return xs.sort(cmp);
}
function playCard(p,i){
  const z=zoneLs(p);
  return `<button class="card pcard" data-popen="${esc(p.id)}" style="animation-delay:${Math.min(i,10)*28}ms">
    <div class="thumb">${boardSVG(p.board)}</div>
    <div class="body">
      <span class="name">${esc(p.name||"Senza nome")}</span>
      <div class="focus">${sitL(p)?esc(sitL(p)):`<span class="nofocus">Situazione da definire</span>`}</div>
      <div class="meta">${z.length?`<span>${ico("area")}${esc(z.slice(0,2).join(" · "))}${z.length>2?` +${z.length-2}`:""}</span>`:""}
        <span>${ico("layers")}<span class="mono">${p.phases.length}</span> ${p.phases.length===1?"fase":"fasi"}</span></div>
    </div></button>`;
